name: Mise à jour des sorties

on:
  schedule:
    - cron: '7 * * * *'            # toutes les heures
    - cron: '5,25,45 23 * * 4'     # jeudi 23 h UTC : minuit à Paris, les sorties du vendredi tombent
    - cron: '25,45 0-5 * * 5'      # nuit de jeudi à vendredi : toutes les 20 minutes
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Préparer le site
        run: |
          mkdir -p site/data
          cp index.html .nojekyll manifest.webmanifest sw.js site/
          cp -r logo site/logo
      - name: Collecter les sorties
        run: node scripts/build-data.mjs
        env:
          SITE_URL: https://zvxltt.github.io/a-l-affut
          OUT_DIR: site/data
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          ODESLI_KEY: ${{ secrets.ODESLI_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # GitHub saute souvent les passages programmés toutes les heures : chaque passage relance lui-même le suivant,
  # une heure après son propre départ, sauf si un autre passage est déjà prévu ou en cours.
  relance:
    needs: publier
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
    steps:
      - name: Attendre l'heure suivante puis relancer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          start=$(gh run view "$RUN_ID" -R "$REPO" --json createdAt --jq '.createdAt')
          wait=$(( $(date -d "$start" +%s) + 3600 - $(date +%s) ))
          if [ "$wait" -gt 3000 ]; then wait=3000; fi
          if [ "$wait" -gt 0 ]; then echo "attente ${wait} s"; sleep "$wait"; fi
          others=$(gh run list -R "$REPO" --workflow update.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != $RUN_ID) | select(.status != \"completed\")] | length")
          if [ "$others" -gt 0 ]; then echo "un passage est déjà prévu ($others) : rien à relancer"; exit 0; fi
          gh workflow run update.yml -R "$REPO" --ref main
          echo "passage suivant lancé"
