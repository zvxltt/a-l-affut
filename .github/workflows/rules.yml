name: Tests des règles Firestore

on:
  push:
    branches: [main]
    paths: ['firebase/**', '.github/workflows/rules.yml']
  workflow_dispatch:

jobs:
  regles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Outils Firebase
        run: npm i --no-save --no-package-lock firebase-tools@13 firebase@10 @firebase/rules-unit-testing@3
      - name: Règles sur l'émulateur
        run: npx firebase emulators:exec --config firebase/firebase.json --only firestore --project demo-affut "node firebase/rules.test.mjs"
