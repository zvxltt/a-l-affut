}
// enregistre la note d’ensemble, la critique et les notes des sons de la sortie k ;
// patch.r et patch.tx remplacent la note et la critique, sinon on garde celles déjà enregistrées
async function writeReview(k, patch) {
  const rel = relOf(k);
  if (!rel || !FB || !ME.profile || !FB.auth.currentUser) throw Object.assign(new Error('indisponible'), { code: 'unavailable' });
  const { F, db, auth } = FB;
  const uid = auth.currentUser.uid;
  const id = `${k}__${uid}`, ref = F.doc(db, 'reviews', id);
  const cur = (ME.reviews && ME.reviews.get(k)) || null;
  const r = patch.r !== undefined ? patch.r : cur ? cur.r || 0 : 0;
  const tx = String(patch.tx !== undefined ? patch.tx : cur ? cur.tx || '' : '').trim().slice(0, 3000);
  const draft = TRDRAFT.get(k);
  const tr = trEncode(tracksOff || !draft ? trDecode(cur && cur.tr) : draft);
  const titles = tr ? trackTitles(k, cur) : [];
  const tl = titles.length ? titles.map(t => t.replace(/\s+/g, ' ').slice(0, 120)).join('\n').slice(0, 8000) : '';
  const w = weekStartOf(rel.date);
  if (!r && !tr) {
    if (cur) await F.deleteDoc(ref);
    if (ME.reviews) ME.reviews.delete(k);
    if (TRDRAFT.get(k) === draft) TRDRAFT.delete(k);
    afterWrite(k, w, null, cur);
    return null;
  }
  const data = {
    k, uid, r, w, d: rel.date, t: rel.title.slice(0, 300), a: rel.artist.slice(0, 300),
    img: (coverUrl(rel, 500) || '').slice(0, 600), rt: rel.rt, c: rel.cat, h: ME.profile.h, n: ME.profile.n, ph: phForReview(ME.profile.ph),
  };
  if (tx) data.tx = tx;
  if (tr) { data.tr = tr; if (tl) data.tl = tl; }
  const create = () => F.setDoc(ref, { ...data, at: F.serverTimestamp(), up: F.serverTimestamp() });
  // une mise à jour ne renvoie jamais « at » : la date de première publication reste celle de la base
  const update = () => F.updateDoc(ref, {
    ...data, up: F.serverTimestamp(),
    ...(tx ? {} : { tx: F.deleteField() }),
    ...(tr ? (tl ? {} : { tl: F.deleteField() }) : { tr: F.deleteField(), tl: F.deleteField() }),
  });
  try {
    try { await (cur ? update() : create()); }
    catch (e) {
      // la copie locale peut être en retard sur la base (autre appareil) : on tente l’autre écriture, une fois
      if (cur && e && e.code === 'not-found') await create();
      else if (!cur && e && e.code === 'permission-denied' && await getDocData('reviews', id)) await update();
      else throw e;
    }
  } catch (e) {
    if (e && e.code === 'permission-denied' && tr && !tracksOff && windowOf(rel).state === 'open' && !trDecode(cur && cur.tr).some(Boolean)) {
      // les règles en ligne ne connaissent pas encore les notes des sons : on enregistre sans elles
      tracksOff = true;
      TRDRAFT.delete(k);
      return writeReview(k, patch);
    }
    throw e;
  }
  const saved = { ...data, id, at: cur && cur.at ? cur.at : stamp(), up: stamp() };
  ME.reviews = ME.reviews || new Map();
  ME.reviews.set(k, saved);
  if (TRDRAFT.get(k) === draft) TRDRAFT.delete(k);
  afterWrite(k, w, saved, cur);
  return saved;
}
async function removeReview(k) {
  const { F, db, auth } = FB;
  const cur = ME.reviews && ME.reviews.get(k);
  await F.deleteDoc(F.doc(db, 'reviews', `${k}__${auth.currentUser.uid}`));

async function saveReview(k) {
  const r = detailRelease();

  const el = $('#rate-in');
  const v = el ? Number(el.dataset.v || 0) : 0;

  const tx = ($('#rv-text') || {}).value || '';
  const btn = $('[data-act="rv-save"]');

async function deleteReview(k) {
  const r = detailRelease();

// les sons de la semaine : titres notés un par un, et singles d’un seul titre notés comme sortie
function topSongs(list) {
  const out = [];

    const a = ratingOf(r);
    if (!a) continue;
    if (r.rt === 'single' && (r.n || 1) <= 1) { if (a.n) out.push({ r, i: -1, title: r.title, n: a.n, sum: a.sum, avg: a.avg }); continue; }
    if (!a.raters) continue;
    const titles = trackTitles(r.key, a);
    a.tracks.forEach((e, i) => { if (e && e.n) out.push({ r, i, title: titles[i] || `Titre ${i + 1}`, n: e.n, sum: e.sum, avg: e.avg }); });
  }

}
let TOP_TAB = 'p';

    .sort((x, y) => bayes(y.a) - bayes(x.a) || y.a.n - x.a.n).slice(0, 5);
  const songs = topSongs(list).slice(0, 5);
  if (!proj.length && !songs.length) return '';

/* ---------- abonnements ----------
   Comme sur Letterboxd : on s’abonne à quelqu’un sans demande à accepter (les notes sont publiques).
   Les abonnements sont dans users/{uid}.fr ; les abonnés se retrouvent par « fr contient son identifiant ». */
const USERS = new Map();      // uid -> profil public, ou null s’il est introuvable

async function usersByIds(ids) {
  const { F, db } = await fb();
  await Promise.all(chunks(ids, 30).map(async part => {
    const snap = await F.getDocs(F.query(F.collection(db, 'users'), F.where(F.documentId(), 'in', part)));
    const found = new Set();
    snap.docs.forEach(d => { USERS.set(d.id, d.data()); found.add(d.id); });

    FOLLOWERS.set(uid, e);

/* ---------- fil d’actualité (onglet Abonnements) ----------
   Les notes des abonnements, semaine par semaine : « uid parmi 30 » + « semaine = w »,
   ce qui ne demande aucun index composé dans Firestore. Tri du plus récent au plus ancien. */
let FEED = null;              // { at, weeks, items, done, stale }
const postTime = x => tsMs(x.at) || tsMs(x.up);
let FEED_TAB = 'tout';        // tout | critiques
const FEED_STEP = 4, FEED_MAX = 26;
const weekList = (from, n) => Array.from({ length: n }, (_, i) => addDays(weekStartOf(today()), -7 * (from + i)));
let feedLoading = null;
function loadFeed(more) {
  if (feedLoading) return feedLoading;
  const ids = following();
  const fresh = !FEED || FEED.stale;
  const from = more && !fresh ? FEED.weeks : 0;
  const weeks = weekList(from, FEED_STEP);
  feedLoading = (async () => {
    if (!ids.length) return (FEED = { at: Date.now(), weeks: FEED_STEP, items: [], done: true });
    const { F, db } = await fb();
    const got = [];
    await Promise.all(weeks.flatMap(w => chunks(ids, 30).map(async part => {
      const snap = await F.getDocs(F.query(F.collection(db, 'reviews'), F.where('uid', 'in', part), F.where('w', '==', w), F.limit(500)));
      snap.docs.forEach(d => got.push({ id: d.id, ...d.data() }));
    })));
    // en rafraîchissant les semaines récentes, on garde les plus anciennes déjà chargées
    const keep = fresh ? [] : FEED.items.filter(x => !weeks.includes(x.w));
    const items = [...keep, ...got].filter(x => ids.includes(x.uid)).sort((a, b) => postTime(b) - postTime(a));
    const n = more && !fresh ? from + FEED_STEP : fresh ? FEED_STEP : Math.max(FEED.weeks, FEED_STEP);
    return (FEED = { at: Date.now(), weeks: n, items, done: n >= FEED_MAX });

  return feedLoading;
}

// les sons notés d’un profil : titres notés un par un, et singles notés sans détail des titres
function songsOf(reviews) {
  const out = [];
  for (const x of reviews) {
    const t = trDecode(x.tr);
    if (t.some(Boolean)) {
      const titles = trackTitles(x.k, x);
      t.forEach((v, i) => { if (v) out.push({ x, i, v, title: titles[i] || `Titre ${i + 1}` }); });
    } else if (x.rt === 'single' && x.r >= 1) out.push({ x, i: -1, v: x.r, title: x.t });
  }
  return out.sort((a, b) => b.v - a.v || tsMs(b.x.up) - tsMs(a.x.up) || a.i - b.i);
}
function songsHtml(songs) {
  return `<ol class="toprated songs">${songs.map((s, idx) => `<li><button class="tr" type="button" data-rkey="${esc(s.x.k)}" data-from="rv"${s.i >= 0 ? ` data-ti="${s.i}"` : ''}><span class="tr-n">${idx + 1}</span>

function pickCandidates(q) {
  const seen = new Set();
  const out = [];
  const push = x => { if (!x.k || seen.has(x.k)) return; seen.add(x.k); out.push(x); };
  for (const x of [...(ME.reviews || new Map()).values()].sort((a, b) => b.r - a.r)) push({ k: x.k, t: x.t, a: x.a, img: x.img, d: x.d, rt: x.rt, c: x.c, mine: x.r >= 1 ? x.r : 0 });
  const t = today();
  for (const r of [...DATA.items].filter(r => r.date <= t).sort((a, b) => b.pop - a.pop)) push({ k: r.key, t: r.title, a: r.artist, img: coverUrl(r, 500), d: r.date, rt: r.rt, c: r.cat });
  const nq = norm(q);
  return out.filter(x => !nq || norm(`${x.t} ${x.a}`).includes(nq)).slice(0, 40);
}
function paintPick(q) {
  const list = $('#pick-list');
  if (!list) return;

  list.innerHTML = items.length ? items.map(x => `<button class="pick" type="button" data-act="vit-pick" data-k="${esc(x.k)}" ${inSc.has(x.k) ? 'disabled' : ''}>
      <span class="cover">${x.img ? `<img src="${esc(x.img)}" alt="" loading="lazy">` : `<span class="ph" aria-hidden="true">${esc(initial(x.t))}</span>`}</span>
      <span class="pick-t"><b>${esc(x.t)}</b><span>${esc(x.a)}</span></span>
      ${x.mine ? noteStars(x.mine, 'sm') : ''}${inSc.has(x.k) ? '<span class="pick-in">déjà dans ta vitrine</span>' : ''}</button>`).join('')
    : '<p class="muted">Aucune sortie trouvée.</p>';
}

const INTRO = [

function introArt(a) {

let introI = 0;

{ let x0 = null;   // glisser du doigt pour changer d’étape
