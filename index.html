<style>
:root {
  /* Direction : noir et blanc strict, comme le logo ; seules les pochettes apportent la couleur.
     Mise en page : grille de pochettes (albums, EP), liste dense (singles), frise par date (à venir). */
  --bg: #FFFFFF;
  --soft: #F2F2F0;
  --line: #E3E3E0;
  --ink: #0A0A0A;
  --ink-2: #3B3B3A;
  --muted: #6E6E6C;
  --font-display: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --wrap: 1240px;
  --shadow: 0 1px 2px rgba(10, 10, 10, .06), 0 12px 32px rgba(10, 10, 10, .10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0B; --soft: #181817; --line: #272726; --ink: #F4F4F1; --ink-2: #CFCFCB; --muted: #9D9D99;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0B0B; --soft: #181817; --line: #272726; --ink: #F4F4F1; --ink-2: #CFCFCB; --muted: #9D9D99;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font-body); font-stretch: 100%;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
a { color: inherit; }
img { max-width: 100%; display: block; }
svg { flex: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 600; text-decoration: none; }
.skip:focus { top: 12px; }

/* ---------- en-tête ---------- */
.top {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.top-in {
  position: relative; max-width: var(--wrap); margin: 0 auto;
  padding: 12px max(20px, env(safe-area-inset-right)) 12px max(20px, env(safe-area-inset-left));
  display: flex; align-items: center; gap: 28px;
}
.brand { display: flex; align-items: center; flex: none; text-decoration: none; border-radius: 8px; }
.logo { height: 30px; width: auto; display: block; }
.logo-sq { fill: var(--ink); }
.logo-g { stroke: var(--bg); fill: none; }
.logo-d { fill: var(--bg); }
.logo-w { fill: var(--ink); }
.tabs { display: flex; gap: 2px; }
.tab {
  display: inline-flex; align-items: center; gap: 6px;
  font-weight: 600; font-size: 14px; padding: 7px 13px; border-radius: 999px;
  color: var(--muted); text-decoration: none; white-space: nowrap;
  transition: color .15s, background-color .15s;
}
.tab:hover { color: var(--ink); background: var(--soft); }
.tab[aria-current="page"] { color: var(--bg); background: var(--ink); }
.tab .n { font: 600 11px var(--font-mono); opacity: .75; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.status { font: 500 12px var(--font-mono); color: var(--muted); white-space: nowrap; margin-right: 8px; font-variant-numeric: tabular-nums; }
.icon-btn {
  width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 999px;
  color: var(--ink); transition: background-color .15s;
}
.icon-btn:hover:not(:disabled) { background: var(--soft); }
.icon-btn:disabled { cursor: default; }
.icon-btn svg { width: 18px; height: 18px; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; opacity: 0; transition: opacity .3s; }
.bar.on { opacity: 1; }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .4s ease; }

/* ---------- structure ---------- */
main {
  max-width: var(--wrap); margin: 0 auto; min-height: 60vh;
  padding: 36px max(20px, env(safe-area-inset-right)) 72px max(20px, env(safe-area-inset-left));
}
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 18px 24px; }
.head-main { min-width: 0; flex: 1 1 420px; }
.kicker { font: 600 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.h1 {
  font-family: var(--font-display); font-weight: 800; font-stretch: 116%;
  font-size: clamp(34px, 5.6vw, 64px); line-height: 1; letter-spacing: -0.03em;
  margin: 12px 0 0; text-wrap: balance;
}
.sub { color: var(--ink-2); margin: 14px 0 0; max-width: 64ch; text-wrap: pretty; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font-weight: 600; font-size: 14px; line-height: 1.2;
  text-decoration: none; white-space: nowrap; transition: border-color .15s, background-color .15s, color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.solid:hover:not(:disabled) { background: var(--ink-2); border-color: var(--ink-2); }
.btn.icon { width: 38px; padding: 0; }
.btn svg { width: 16px; height: 16px; }
.stats { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px 26px; margin: 8px 0 0; padding: 0; list-style: none; }
.stats li { display: flex; align-items: baseline; gap: 8px; color: var(--ink-2); font-size: 14px; }
.stats b { font: 600 24px/1 var(--font-mono); color: var(--ink); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

/* ---------- filtres ---------- */
.filters {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px;
  margin: 28px 0 0; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--soft); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px;
  font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; transition: background-color .15s, color .15s, box-shadow .15s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0, 0, 0, .07); }
.seg .n { font: 500 11px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.search { position: relative; margin-left: auto; flex: 0 1 270px; min-width: 190px; }
.search input {
  width: 100%; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  padding: 0 14px 0 38px; font: 400 14px var(--font-body); -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--ink); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }

/* ---------- sections et pochettes ---------- */
.sec { margin-top: 42px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 16px; }
.sec-h h2 { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 22px; line-height: 1.1; letter-spacing: -0.015em; margin: 0; }
.sec-h .n { font: 500 13px var(--font-mono); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 30px 20px; }
.card { display: flex; flex-direction: column; gap: 12px; text-align: left; min-width: 0; border-radius: 10px; }
.cover {
  position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden;
  background: var(--soft); container-type: inline-size;
}
.cover::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .16); pointer-events: none; }
.cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.card:hover .cover img { transform: scale(1.035); }
.ph {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-stretch: 125%; font-size: 42cqw; line-height: 1; color: var(--muted);
}
.flag {
  position: absolute; z-index: 1; top: 8px; left: 8px; padding: 4px 8px; border-radius: 999px;
  background: var(--ink); color: var(--bg); font: 600 10px/1.2 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
}
.card-t { display: grid; gap: 2px; min-width: 0; }
.card-title { font-weight: 700; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.card-artist { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.card-feat { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.35; }
.feat { color: var(--muted); font-size: 13px; }
.meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; margin-top: 7px;
  font: 500 11px var(--font-mono); letter-spacing: .03em; text-transform: uppercase; color: var(--muted);
}
.pill {
  display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px;
  font: 600 10.5px/1 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
}
.pill.album, .pill.compile { background: var(--ink); color: var(--bg); }
.pill.ep { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
.pill.single { background: var(--soft); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.ex {
  display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 3px; margin-left: 6px; vertical-align: 1px;
  background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font: 700 9px/1 var(--font-mono);
}
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); margin-right: 8px; vertical-align: 2px; }

.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); column-gap: 36px; }
.row {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 14px;
  padding: 10px 10px; margin: 0 -10px; border-radius: 10px; text-align: left; min-width: 0;
  box-shadow: inset 0 -1px 0 var(--line); transition: background-color .15s;
}
.row:hover { background: var(--soft); box-shadow: none; }
.row .cover { width: 56px; border-radius: 6px; }
.row .ph { font-size: 46cqw; }
.row-t { display: grid; gap: 1px; min-width: 0; }
.row-title { font-weight: 650; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.row-artist { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.row-cat { font: 500 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-top: 3px; }
.row-side {
  display: grid; justify-items: end; gap: 5px; text-align: right;
  font: 500 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
}

/* ---------- à venir ---------- */
.days { margin-top: 30px; }
.day { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 10px 32px; padding: 26px 0; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; padding-top: 4px; }
.day-h { position: sticky; top: 84px; align-self: start; }
.day-d { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 24px; line-height: 1.05; letter-spacing: -0.02em; }
.day-r { font: 500 12px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
.day-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); column-gap: 36px; }
.src { font: 500 10.5px var(--font-mono); color: var(--muted); letter-spacing: .04em; }

/* ---------- messages ---------- */
.note {
  margin-top: 28px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; color: var(--ink-2);
}
.note p { margin: 0; flex: 1 1 320px; }
.note strong { color: var(--ink); }
.empty { margin-top: 36px; padding: 52px 24px; border: 1px dashed var(--line); border-radius: 16px; text-align: center; color: var(--ink-2); }
.empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.empty .btn { margin-top: 18px; }
.sk { position: relative; overflow: hidden; background: var(--soft); border-radius: 8px; }
.sk::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--bg) 60%, transparent), transparent);
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }
.sk-card { display: grid; gap: 10px; }
.sk-card .sk:first-child { aspect-ratio: 1 / 1; }

/* ---------- fiche détaillée ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .25s, visibility .25s; }
.drawer {
  position: fixed; z-index: 51; top: 0; right: 0; height: 100%; width: min(520px, 100%);
  background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateX(104%); visibility: hidden; transition: transform .32s cubic-bezier(.2, .8, .2, 1), visibility .32s;
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; pointer-events: none;
}
body.d-open { overflow: hidden; }
body.d-open .scrim { opacity: 1; visibility: visible; pointer-events: auto; }
body.d-open .drawer { transform: none; visibility: visible; pointer-events: auto; }
.d-bar {
  position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
  padding: calc(10px + env(safe-area-inset-top)) 14px 10px 28px;
  background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.d-cover { width: calc(100% - 56px); margin: 6px 28px 0; border-radius: 10px; box-shadow: var(--shadow); }
.d-main { padding: 24px 28px calc(48px + env(safe-area-inset-bottom)); }
.d-main .meta { margin-top: 0; }
.d-title {
  font-family: var(--font-display); font-weight: 800; font-stretch: 112%;
  font-size: clamp(28px, 4.2vw, 36px); line-height: 1.04; letter-spacing: -0.025em;
  margin: 14px 0 8px; text-wrap: balance; overflow-wrap: anywhere;
}
.d-artist { margin: 0; font-size: 17px; font-weight: 650; }
.d-date { margin: 6px 0 0; color: var(--ink-2); }
.d-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.facts { display: flex; flex-wrap: wrap; gap: 1px; margin: 24px 0 0; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.facts div { flex: 1 1 118px; background: var(--bg); padding: 12px 14px; min-width: 0; }
.facts dt { font: 600 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.facts dd { margin: 5px 0 0; font-weight: 650; overflow-wrap: anywhere; }
.d-h3 { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 30px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--soft); font-size: 13.5px; font-weight: 600; }
.chip .mono { font-size: 11px; color: var(--muted); }
.tracks { list-style: none; margin: 0; padding: 0; }
.trk { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 34px; align-items: center; gap: 10px; padding: 9px 0; box-shadow: inset 0 -1px 0 var(--line); }
.trk.off { opacity: .55; }
.trk-n { font: 500 12px var(--font-mono); color: var(--muted); text-align: right; }
.trk-m { display: grid; min-width: 0; }
.trk-t { font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
.trk-f { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.trk-d { font: 500 12.5px var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.play { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .15s, background-color .15s; }
.play:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.play[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.play svg { width: 12px; height: 12px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.d-msg { color: var(--muted); margin: 18px 0 0; }
.d-src { margin: 26px 0 0; font: 500 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.trk-sk { display: grid; gap: 8px; margin-top: 30px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 70;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
  box-shadow: var(--shadow); transition: opacity .25s, transform .25s; max-width: calc(100% - 40px); text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.foot {
  max-width: var(--wrap); margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
  padding: 26px max(20px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  border-top: 1px solid var(--line); color: var(--muted); font-size: 13px;
}

@media (max-width: 860px) {
  .top-in { flex-wrap: wrap; gap: 8px 12px; padding-top: 10px; padding-bottom: 8px; }
  .logo { height: 26px; }
  .tabs { order: 3; width: calc(100% + 8px); margin: 0 -4px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .status { display: none; }
  .day { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .day-h { position: static; }
}
@media (max-width: 760px) {
  main { padding-top: 26px; }
  .search { order: -1; flex: 1 1 100%; margin-left: 0; }
}
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; }
  .rows, .day-list { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; }
  .row .cover { width: 52px; }
  .stats { gap: 8px 18px; }
  .stats b { font-size: 20px; }
  .seg button { padding: 6px 9px; font-size: 12.5px; gap: 4px; }
  .d-cover { width: calc(100% - 40px); margin: 4px 20px 0; }
  .d-main { padding-left: 20px; padding-right: 20px; }
  .d-bar { padding-left: 20px; }
}
@media (hover: none) {
  .card:hover .cover img { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

.status .live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: 1px; opacity: .7; }
.month { margin: 38px 0 0; font: 600 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.month + .days { margin-top: 10px; }
.d-msg a { color: var(--ink); }
</style>

<script>
(() => {
'use strict';

/* =====================================================================
   Réglages
   ===================================================================== */
const DATA_URL = 'data/releases.json';
const DETAILS_URL = 'data/details.json';
const POLL_MS = 3 * 60e3;           // le site vérifie s’il y a du nouveau toutes les 3 minutes
const MAX_BACK = 8;                 // semaines consultables en arrière
const CATS = { rfr: 'Rap FR', rus: 'Rap US', mfr: 'Musique FR' };
const TYPE_LABEL = { album: 'Album', ep: 'EP', single: 'Single', compile: 'Compil' };
const SRC_LABEL = { dz: 'Deezer', it: 'Apple Music', mb: 'MusicBrainz', wk: 'Wikipédia', an: 'Annonce presse' };

const I = {
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
  theme: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor" stroke="none"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.6v14.8L19.5 12z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16L16 8M9 8h7v7"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
};

/* =====================================================================
   Outils
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const isYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
// Les sorties tombent le vendredi : une semaine va du vendredi au jeudi.
const weekStartOf = s => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 2) % 7)); return ymd(d); };

const DOW = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const DOW_S = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const MON = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MON_S = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const dnum = n => (n === 1 ? '1er' : String(n));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const yearSuffix = d => (d.getFullYear() !== new Date().getFullYear() ? ` ${d.getFullYear()}` : '');
const fmtShort = s => { const d = parseYmd(s); return `${DOW_S[d.getDay()]} ${d.getDate()} ${MON_S[d.getMonth()]}`; };
const fmtDay = s => { const d = parseYmd(s); return `${DOW[d.getDay()]} ${dnum(d.getDate())} ${MON[d.getMonth()]}${yearSuffix(d)}`; };
const fmtLong = s => { const d = parseYmd(s); return `${DOW[d.getDay()]} ${dnum(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
function fmtRange(a, b) {
  const A = parseYmd(a), B = parseYmd(b);
  if (A.getFullYear() !== B.getFullYear()) return `${dnum(A.getDate())} ${MON[A.getMonth()]} ${A.getFullYear()} – ${dnum(B.getDate())} ${MON[B.getMonth()]} ${B.getFullYear()}`;
  if (A.getMonth() !== B.getMonth()) return `${dnum(A.getDate())} ${MON[A.getMonth()]} – ${dnum(B.getDate())} ${MON[B.getMonth()]}${yearSuffix(B)}`;
  return `${dnum(A.getDate())} – ${dnum(B.getDate())} ${MON[B.getMonth()]}${yearSuffix(B)}`;
}
function relLabel(s) {
  const n = daysBetween(today(), s);
  if (n === 0) return 'aujourd’hui';
  if (n === 1) return 'demain';
  if (n === -1) return 'hier';
  if (n > 1 && n < 14) return `dans ${n} jours`;
  if (n >= 14 && n < 56) return `dans ${Math.round(n / 7)} semaines`;
  if (n >= 56) return `dans ${Math.max(2, Math.round(n / 30.4))} mois`;
  if (n < -1 && n > -14) return `il y a ${-n} jours`;
  if (n <= -14 && n > -60) return `il y a ${Math.round(-n / 7)} semaines`;
  return '';
}
function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60e3));
  if (m < 1) return 'à l’instant';
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  return h < 24 ? `il y a ${h} h` : `il y a ${Math.round(h / 24)} j`;
}
const fmtDur = sec => { sec = Math.round(sec || 0); return `${Math.floor(sec / 60)}:${pad(sec % 60)}`; };
const fmtTotal = sec => { const m = Math.round((sec || 0) / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${pad(m % 60)}`; };
const initial = s => ((String(s || '?').trim().match(/[\p{L}\p{N}]/u) || ['?'])[0]).toUpperCase();
const baseTitle = s => String(s || '').replace(/\s*[(\[][^)\]]*(deluxe|edition|édition|version|bonus|remaster|réédition|extended)[^)\]]*[)\]]/ig, '').trim();
const plural = (n, one, many) => (n > 1 ? many : one);
const store = {
  get(k, d) { try { const v = localStorage.getItem(`affut:${k}`); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(`affut:${k}`, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
};
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('on'), 2600);
}
function coverUrl(r, size) {
  if (r.md5) return `https://cdn-images.dzcdn.net/images/cover/${r.md5}/${size}x${size}-000000-80-0-0.jpg`;
  if (r.cover) return r.cover.replace(/\{s\}/g, String(Math.min(size, 1000)));
  return '';
}

/* =====================================================================
   Données (préparées toutes les heures par le robot sur GitHub)
   ===================================================================== */
let DATA = { generatedAt: '', items: [], byKey: new Map(), artists: 0 };
let DETAILS = null, detailsFor = '';
let loadError = false;
const prefs = store.get('prefs', {});
const S = {
  view: 'semaine', week: 0,
  cat: CATS[prefs.cat] ? prefs.cat : 'all',
  type: TYPE_LABEL[prefs.type] ? prefs.type : 'all',
  q: '', detail: null,
};

function mapItem(x) {
  return {
    key: x.k, title: x.t, artist: x.a, feats: x.f || [], date: x.d, rt: TYPE_LABEL[x.rt] ? x.rt : 'album', cat: x.c,
    md5: x.cv || '', cover: x.cu || '', n: x.n || 0, dur: x.du || 0, label: x.lb || '', genre: x.g || '', ex: !!x.ex,
    pop: x.p || 0, src: x.s || [], dz: x.dz || 0, am: x.am || '', mb: x.mb || '', article: x.src || '',
  };
}
async function loadData(first) {
  try {
    const r = await fetch(DATA_URL, { cache: 'no-cache' });   // revalidation : toujours la dernière version publiée
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    loadError = false;
    if (j.generatedAt === DATA.generatedAt) { paintStatus(); return; }
    const before = new Set(DATA.items.map(x => x.key));
    const items = (j.items || []).filter(x => isYmd(x.d) && CATS[x.c]).map(mapItem);
    const added = DATA.items.length ? items.filter(x => !before.has(x.key)).length : 0;
    DATA = { generatedAt: j.generatedAt, items, byKey: new Map(items.map(x => [x.key, x])), artists: j.artists || 0 };
    render();
    if (added > 0) toast(`${added} ${plural(added, 'nouvelle sortie', 'nouvelles sorties')} à l’instant`);
  } catch (e) {
    loadError = true;
    if (!DATA.items.length) render();
    paintStatus();
  }
}
async function loadDetails() {
  if (DETAILS && detailsFor === DATA.generatedAt) return DETAILS;
  const r = await fetch(DETAILS_URL, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  DETAILS = await r.json();
  detailsFor = DATA.generatedAt;
  return DETAILS;
}

// « Nouveau » = apparu depuis ta dernière visite
const prevSeen = new Set(store.get('seen', []));
const firstEver = prevSeen.size === 0;
const isNew = r => !firstEver && !prevSeen.has(r.key) && r.date >= addDays(today(), -10);
function persistSeen() {
  if (!DATA.items.length) return;
  store.set('seen', [...new Set([...DATA.items.map(x => x.key), ...prevSeen])].slice(0, 8000));
}

/* =====================================================================
   Affichage
   ===================================================================== */
const $head = $('#head'), $content = $('#content'), $filters = $('#filters');
let INDEX = new Map();

function paintStatus() {
  const st = $('#status');
  if (loadError && !DATA.items.length) st.textContent = 'Connexion impossible';
  else if (DATA.generatedAt) st.innerHTML = `<span class="live" aria-hidden="true"></span>Mis à jour ${esc(ago(DATA.generatedAt))}`;
  else st.textContent = 'Chargement…';
  const up = DATA.items.filter(x => x.date > today()).length;
  $('#up-n').textContent = up ? up : '';
  if (DATA.artists) $('#foot-l').textContent = `À l’affût · ${DATA.artists} artistes suivis en rap FR, rap US et musique française`;
}

const matchQ = (r, q) => !q || norm(`${r.title} ${r.artist} ${r.feats.join(' ')}`).includes(q);
const matchType = r => S.type === 'all' || r.rt === S.type || (S.type === 'album' && r.rt === 'compile');
const matchCat = r => S.cat === 'all' || r.cat === S.cat;
const applyFilters = list => { const q = norm(S.q); return list.filter(r => matchCat(r) && matchType(r) && matchQ(r, q)); };
function paintFilters(base) {
  const q = norm(S.q);
  const cc = { all: 0, rfr: 0, rus: 0, mfr: 0 }, tc = { all: 0, album: 0, ep: 0, single: 0 };
  for (const r of base) {
    if (!matchQ(r, q)) continue;
    if (matchType(r)) { cc.all++; cc[r.cat]++; }
    if (matchCat(r)) { tc.all++; tc[r.rt === 'compile' ? 'album' : r.rt]++; }
  }
  $$('[data-cat]', $filters).forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.cat === S.cat)); b.querySelector('.n').textContent = cc[b.dataset.cat] || 0; });
  $$('[data-type]', $filters).forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.type === S.type)); b.querySelector('.n').textContent = tc[b.dataset.type] || 0; });
}
function countTypes(list) {
  const c = { album: 0, ep: 0, single: 0 };
  for (const r of list) c[r.rt === 'compile' ? 'album' : r.rt]++;
  return c;
}
const statsHtml = pairs => `<ul class="stats">${pairs.filter((p, i) => i === 0 || p[0]).map(([n, l]) => `<li><b>${n}</b>${esc(l)}</li>`).join('')}</ul>`;
const section = (title, n, inner) => `<section class="sec"><div class="sec-h"><h2>${esc(title)}</h2><span class="n">${n}</span></div>${inner}</section>`;
const srcText = r => r.src.map(s => SRC_LABEL[s]).filter(Boolean).join(' · ');
function coverHtml(r, size) {
  const url = coverUrl(r, size);
  return url ? `<img src="${esc(url)}" alt="" loading="lazy" decoding="async">` : `<span class="ph" aria-hidden="true">${esc(initial(r.title))}</span>`;
}
function cardHtml(r) {
  INDEX.set(r.key, r);
  const flag = isNew(r) ? 'Nouveau' : r.date > today() ? relLabel(r.date) : '';
  return `<button class="card" type="button" data-key="${esc(r.key)}">
    <span class="cover">${coverHtml(r, 500)}${flag ? `<span class="flag">${esc(flag)}</span>` : ''}</span>
    <span class="card-t">
      <span class="card-title">${esc(r.title)}${r.ex ? '<span class="ex" title="Explicite">E</span>' : ''}</span>
      <span class="card-artist">${esc(r.artist)}</span>
      ${r.feats.length ? `<span class="card-feat">feat. ${esc(r.feats.join(', '))}</span>` : ''}
      <span class="meta"><span>${esc(CATS[r.cat])}</span><span>${esc(fmtShort(r.date))}</span>${r.n > 1 ? `<span>${r.n} titres${r.dur ? ` · ${fmtTotal(r.dur)}` : ''}</span>` : ''}</span>
    </span>
  </button>`;
}
function rowHtml(r, upcoming) {
  INDEX.set(r.key, r);
  const len = r.n > 1 ? `${r.n} titres` : r.dur ? fmtDur(r.dur) : '';
  const side = upcoming
    ? `<span class="pill ${esc(r.rt)}">${esc(TYPE_LABEL[r.rt])}</span><span class="src">${esc(srcText(r))}</span>`
    : `<span>${esc(fmtShort(r.date))}</span><span>${esc(CATS[r.cat])}${len ? ` · ${esc(len)}` : ''}</span>`;
  return `<button class="row" type="button" data-key="${esc(r.key)}">
    <span class="cover">${coverHtml(r, 120)}</span>
    <span class="row-t">
      <span class="row-title">${isNew(r) ? '<span class="dot" title="Nouveau depuis ta dernière visite"></span>' : ''}${esc(r.title)}${r.ex ? '<span class="ex" title="Explicite">E</span>' : ''}</span>
      <span class="row-artist">${esc(r.artist)}${r.feats.length ? ` <span class="feat">· feat. ${esc(r.feats.join(', '))}</span>` : ''}</span>
      ${upcoming ? `<span class="row-cat">${esc(CATS[r.cat])}</span>` : ''}
    </span>
    <span class="row-side">${side}</span>
  </button>`;
}
function skeletonHtml() {
  const card = '<div class="sk-card"><div class="sk"></div><div class="sk" style="height:14px;width:80%"></div><div class="sk" style="height:12px;width:55%"></div></div>';
  return section('Albums', '…', `<div class="grid">${card.repeat(6)}</div>`);
}
function emptyHtml(kind) {
  if (!DATA.items.length) {
    return loadError
      ? '<div class="empty"><strong>Les sorties n’ont pas pu être chargées.</strong>Vérifie ta connexion : le site réessaie tout seul dans un instant.</div>'
      : skeletonHtml();
  }
  if (kind === 'filters') return '<div class="empty"><strong>Aucune sortie avec ces filtres.</strong>Essaie un autre genre ou un autre format.<br><button class="btn" type="button" data-reset>Tout afficher</button></div>';
  if (kind === 'week') return '<div class="empty"><strong>Rien de sorti pour l’instant cette semaine.</strong>Les nouveautés tombent en général le vendredi à minuit.</div>';
  return '<div class="empty"><strong>Aucune sortie annoncée pour l’instant.</strong>Les annonces apparaissent ici dès qu’une plateforme ou la presse les publie.</div>';
}

function render() {
  INDEX = new Map();
  $$('.tab').forEach(a => { if (a.dataset.view === S.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (S.view === 'a-venir') viewUpcoming(); else viewWeek();
  paintStatus();
}

function viewWeek() {
  const t = today();
  const ws = addDays(weekStartOf(t), S.week * 7), we = addDays(ws, 6);
  const base = DATA.items.filter(r => r.date >= ws && r.date <= we);
  paintFilters(base);
  const list = applyFilters(base).sort((a, b) => b.pop - a.pop || b.date.localeCompare(a.date));
  const c = countTypes(list);
  const kicker = S.week === 0 ? `Cette semaine · depuis ${fmtDay(ws)}` : S.week === -1 ? 'Semaine dernière' : `Il y a ${-S.week} semaines`;
  $head.innerHTML = `
    <div class="head-main"><p class="kicker">${esc(kicker)}</p><h1 class="h1">${esc(fmtRange(ws, we))}</h1></div>
    <div class="actions">
      ${S.week < 0 ? '<button class="btn" type="button" data-week="0">Revenir à cette semaine</button>' : ''}
      <button class="btn icon" type="button" data-week="${S.week - 1}" aria-label="Semaine précédente" title="Semaine précédente" ${S.week <= -MAX_BACK ? 'disabled' : ''}>${I.left}</button>
      <button class="btn icon" type="button" data-week="${S.week + 1}" aria-label="Semaine suivante" title="Semaine suivante" ${S.week >= 0 ? 'disabled' : ''}>${I.right}</button>
    </div>
    ${statsHtml([[list.length, plural(list.length, 'sortie', 'sorties')], [c.album, plural(c.album, 'album', 'albums')], [c.ep, 'EP'], [c.single, plural(c.single, 'single', 'singles')]])}`;
  const albums = list.filter(r => r.rt === 'album' || r.rt === 'compile');
  const eps = list.filter(r => r.rt === 'ep');
  const singles = list.filter(r => r.rt === 'single');
  let html = '';
  if (albums.length) html += section('Albums', albums.length, `<div class="grid">${albums.map(cardHtml).join('')}</div>`);
  if (eps.length) html += section('EP', eps.length, `<div class="grid">${eps.map(cardHtml).join('')}</div>`);
  if (singles.length) html += section('Singles', singles.length, `<div class="rows">${singles.map(r => rowHtml(r, false)).join('')}</div>`);
  if (!list.length) html += emptyHtml(base.length ? 'filters' : 'week');
  $content.innerHTML = html;
}

function viewUpcoming() {
  const t = today();
  const base = DATA.items.filter(r => r.date > t);
  paintFilters(base);
  const list = applyFilters(base).sort((a, b) => a.date.localeCompare(b.date) || b.pop - a.pop);
  const c = countTypes(list);
  const next7 = list.filter(r => r.date <= addDays(t, 7)).length;
  $head.innerHTML = `
    <div class="head-main"><p class="kicker">Prochaines sorties</p><h1 class="h1">À venir</h1>
      <p class="sub">Tous les projets annoncés, du plus proche au plus lointain : pré-sorties Deezer, précommandes Apple Music, MusicBrainz, Wikipédia et annonces relayées par la presse.</p></div>
    ${statsHtml([[list.length, plural(list.length, 'sortie annoncée', 'sorties annoncées')], [next7, 'dans les 7 jours'], [c.album, plural(c.album, 'album', 'albums')], [c.ep, 'EP'], [c.single, plural(c.single, 'single', 'singles')]])}`;
  let html = '';
  let month = '';
  let open = false;
  let g = null;
  const groups = [];
  for (const r of list) {
    if (!g || g.date !== r.date) groups.push(g = { date: r.date, items: [] });
    g.items.push(r);
  }
  for (const grp of groups) {
    const d = parseYmd(grp.date);
    const m = `${MON[d.getMonth()]} ${d.getFullYear()}`;
    if (m !== month) {
      if (open) html += '</div>';
      html += `<h2 class="month">${esc(cap(m))}</h2><div class="days">`;
      month = m; open = true;
    }
    html += `<section class="day">
      <div class="day-h"><div class="day-d">${esc(cap(fmtShort(grp.date)))}</div><div class="day-r">${esc(relLabel(grp.date))}</div></div>
      <div class="day-list">${grp.items.map(r => rowHtml(r, true)).join('')}</div>
    </section>`;
  }
  if (open) html += '</div>';
  if (!list.length) html += emptyHtml(base.length ? 'filters' : 'upcoming');
  $content.innerHTML = html;
}

/* =====================================================================
   Fiche détaillée
   ===================================================================== */
const $drawer = $('#drawer'), $dbody = $('#d-body');
let lastFocus = null;
let previews = new Map();     // identifiant de titre Deezer -> extrait (récupéré à l’ouverture, les liens expirent)
let jpSeq = 0;
function jsonp(url, timeout = 10000) {
  return new Promise((resolve, reject) => {
    const name = `__affut${++jpSeq}`;
    const s = document.createElement('script');
    const done = () => { clearTimeout(timer); s.remove(); window[name] = () => {}; };
    const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, timeout);
    window[name] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = `${url}${url.includes('?') ? '&' : '?'}output=jsonp&callback=${name}`;
    document.head.appendChild(s);
  });
}
async function loadPreviews(r) {
  if (!r.dz) return;
  try {
    const alb = await jsonp(`https://api.deezer.com/album/${r.dz}`);
    for (const t of (alb.tracks && alb.tracks.data) || []) if (t.preview) previews.set(t.id, t.preview);
    if (S.detail === r.key) paintDetail(r);
  } catch (e) { /* les extraits sont un bonus */ }
}
function openDetail(key) {
  const r = INDEX.get(key) || DATA.byKey.get(key);
  if (!r) return;
  S.detail = key;
  lastFocus = document.activeElement;
  document.body.classList.add('d-open');
  $drawer.setAttribute('aria-hidden', 'false');
  $drawer.inert = false;
  $drawer.scrollTop = 0;
  paintDetail(r);
  $('#d-close').focus({ preventScroll: true });
  loadDetails().then(() => { if (S.detail === key) paintDetail(r); }, () => { if (S.detail === key) paintDetail(r, true); });
  loadPreviews(r);
}
function closeDetail() {
  if (!S.detail) return;
  S.detail = null;
  document.body.classList.remove('d-open');
  $drawer.setAttribute('aria-hidden', 'true');
  $drawer.inert = true;
  audio.pause();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
function linksHtml(r) {
  const q = encodeURIComponent(`${r.artist} ${baseTitle(r.title)}`);
  const L = [
    ['Deezer', r.dz ? `https://www.deezer.com/fr/album/${r.dz}` : `https://www.deezer.com/search/${q}`],
    ['Spotify', `https://open.spotify.com/search/${q}`],
    ['Apple Music', r.am || `https://music.apple.com/fr/search?term=${q}`],
    ['YouTube', `https://www.youtube.com/results?search_query=${q}`],
  ];
  if (r.mb) L.push(['MusicBrainz', `https://musicbrainz.org/release-group/${r.mb}`]);
  if (r.src.includes('wk')) L.push(['Wikipédia', `https://en.wikipedia.org/wiki/${parseYmd(r.date).getFullYear()}_in_hip-hop#Upcoming_releases`]);
  if (r.article) L.push(['Source de l’annonce', r.article]);
  const share = r.dz ? `https://www.deezer.com/fr/album/${r.dz}` : r.am || '';
  return L.map(([n, u]) => `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}${I.ext}</a>`).join('')
    + (share ? `<button class="btn" type="button" data-copy="${esc(share)}">${I.link}Copier le lien</button>` : '');
}
function paintDetail(r, failed) {
  const rows = DETAILS ? DETAILS[r.key] || [] : null;   // [n, titre, feats, avec, durée, explicite, id Deezer, extrait]
  const released = r.date <= today();
  const rel = relLabel(r.date);
  const complete = rows && rows.length && (!r.n || rows.length >= r.n);
  const total = rows && rows.length ? rows.reduce((s, x) => s + (x[4] || 0), 0) : 0;
  const dur = r.dur || (complete ? total : 0);
  const facts = [];
  if (dur && (complete || r.dur)) facts.push(['Durée', fmtTotal(dur)]);
  if (r.n || (rows && rows.length)) facts.push(['Titres', String(r.n || rows.length)]);
  if (r.label) facts.push(['Label', r.label]);
  if (r.genre) facts.push(['Genre', r.genre]);
  const featCount = new Map();
  for (const f of r.feats) featCount.set(norm(f), { name: f, n: 0 });
  if (rows) for (const x of rows) for (const f of [x[3], ...(x[2] || [])].filter(Boolean)) {
    const k = norm(f);
    const e = featCount.get(k) || { name: f, n: 0 };
    e.n++; featCount.set(k, e);
  }
  const feats = [...featCount.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name, 'fr'));
  const playing = audio.src && !audio.paused ? audio.src : '';
  let tracks;
  if (!rows) tracks = failed ? '<p class="d-msg">La tracklist n’a pas pu être chargée. Réessaie dans un instant.</p>' : `<div class="trk-sk">${'<div class="sk" style="height:44px"></div>'.repeat(6)}</div>`;
  else if (!rows.length) tracks = `<p class="d-msg">${released ? 'Tracklist indisponible pour ce projet.' : 'La tracklist n’est pas encore dévoilée.'}</p>`;
  else {
    const partial = r.n && rows.length < r.n ? ` · ${rows.length} ${plural(rows.length, 'titre dévoilé', 'titres dévoilés')} sur ${r.n}` : '';
    tracks = `<h3 class="d-h3">Tracklist${partial}</h3><ol class="tracks">${rows.map(x => {
      const [n, title, fts, by, d, ex, id, pv] = x;
      const prev = pv || (id && previews.get(id)) || '';
      const credits = [by ? `avec ${esc(by)}` : '', fts && fts.length ? `feat. ${esc(fts.join(', '))}` : ''].filter(Boolean).join(' · ');
      const on = prev && playing === prev;
      return `<li class="trk"><span class="trk-n">${n}</span>
        <span class="trk-m"><span class="trk-t">${esc(title)}${ex ? '<span class="ex" title="Explicite">E</span>' : ''}</span>${credits ? `<span class="trk-f">${credits}</span>` : ''}</span>
        <span class="trk-d">${d ? fmtDur(d) : ''}</span>
        ${prev ? `<button class="play" type="button" data-play="${esc(prev)}" aria-pressed="${on}" aria-label="Écouter un extrait de ${esc(title)}">${on ? I.pause : I.play}</button>` : '<span></span>'}
      </li>`;
    }).join('')}</ol>`;
  }
  const big = coverUrl(r, 1000);
  $('#d-kicker').textContent = TYPE_LABEL[r.rt] || 'Fiche';
  $dbody.innerHTML = `
    <div class="d-cover cover">${big ? `<img src="${esc(big)}" alt="Pochette de ${esc(r.title)}">` : `<span class="ph" aria-hidden="true">${esc(initial(r.title))}</span>`}</div>
    <div class="d-main">
      <div class="meta"><span class="pill ${esc(r.rt)}">${esc(TYPE_LABEL[r.rt])}</span><span>${esc(CATS[r.cat])}</span>${r.ex ? '<span>Explicite</span>' : ''}${isNew(r) ? '<span>· Nouveau</span>' : ''}</div>
      <h2 class="d-title" id="d-title">${esc(r.title)}</h2>
      <p class="d-artist">${esc(r.artist)}</p>
      <p class="d-date">${released ? 'Sorti le' : 'Sortie prévue le'} ${esc(fmtLong(r.date))}${rel ? ` · ${esc(rel)}` : ''}</p>
      ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
      ${feats.length ? `<h3 class="d-h3">Featurings</h3><div class="chips">${feats.map(f => `<span class="chip">${esc(f.name)}${f.n > 1 ? `<span class="mono">×${f.n}</span>` : ''}</span>`).join('')}</div>` : ''}
      ${tracks}
      <h3 class="d-h3">Écouter</h3>
      <div class="links">${linksHtml(r)}</div>
      <p class="d-src">Source : ${esc(srcText(r))}</p>
    </div>`;
}

const audio = new Audio();
audio.preload = 'none';
function syncPlay() {
  const playing = audio.src && !audio.paused ? audio.src : '';
  $$('[data-play]').forEach(b => {
    const on = !!playing && b.dataset.play === playing;
    b.setAttribute('aria-pressed', String(on));
    b.innerHTML = on ? I.pause : I.play;
  });
}
['play', 'pause', 'ended'].forEach(ev => audio.addEventListener(ev, syncPlay));

/* =====================================================================
   Navigation
   ===================================================================== */
let theme = store.get('theme', 'auto');
function applyTheme() {
  const root = document.documentElement;
  if (theme === 'auto') delete root.dataset.theme; else root.dataset.theme = theme;
  const dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('meta[name="theme-color"]').setAttribute('content', dark ? '#0B0B0B' : '#FFFFFF');
  const label = `Thème : ${theme === 'auto' ? 'automatique' : theme === 'dark' ? 'sombre' : 'clair'}`;
  $('#theme').setAttribute('aria-label', `${label}. Changer le thème`);
  $('#theme').title = label;
}
const savePrefs = () => store.set('prefs', { cat: S.cat, type: S.type });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-key],[data-week],[data-cat],[data-type],[data-play],[data-copy],[data-reset],#theme,#scrim,#d-close');
  if (!el) return;
  const ds = el.dataset;
  if (el.id === 'scrim' || el.id === 'd-close') { closeDetail(); return; }
  if (el.id === 'theme') {
    theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto';
    store.set('theme', theme); applyTheme();
    toast(theme === 'auto' ? 'Thème automatique (suit ton appareil)' : theme === 'dark' ? 'Thème sombre' : 'Thème clair');
    return;
  }
  if (ds.key) { openDetail(ds.key); return; }
  if (ds.week !== undefined) { S.week = Math.min(0, Math.max(-MAX_BACK, Number(ds.week))); render(); return; }
  if (ds.cat) { S.cat = ds.cat; savePrefs(); render(); return; }
  if (ds.type) { S.type = ds.type; savePrefs(); render(); return; }
  if (ds.reset !== undefined) { S.cat = 'all'; S.type = 'all'; S.q = ''; $('#q').value = ''; savePrefs(); render(); return; }
  if (ds.play) {
    if (audio.src === ds.play && !audio.paused) audio.pause();
    else { audio.src = ds.play; audio.play().catch(() => toast('Extrait indisponible pour ce titre')); }
    return;
  }
  if (ds.copy) {
    (navigator.clipboard ? navigator.clipboard.writeText(ds.copy) : Promise.reject())
      .then(() => toast('Lien copié'), () => toast(ds.copy));
  }
});
let qTimer = null;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = e.target.value; render(); }, 140); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.detail) { closeDetail(); return; }
  if (S.detail || S.view !== 'semaine' || e.altKey || e.ctrlKey || e.metaKey) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft' && S.week > -MAX_BACK) { S.week--; render(); }
  if (e.key === 'ArrowRight' && S.week < 0) { S.week++; render(); }
});
document.addEventListener('error', e => {
  const img = e.target;
  if (img && img.tagName === 'IMG' && img.parentElement && img.parentElement.classList.contains('cover')) {
    const ph = document.createElement('span');
    ph.className = 'ph'; ph.setAttribute('aria-hidden', 'true'); ph.textContent = '♪';
    img.replaceWith(ph);
  }
}, true);
function route() {
  const v = location.hash === '#a-venir' ? 'a-venir' : 'semaine';
  const changed = v !== S.view;
  S.view = v;
  if (S.detail) closeDetail();
  render();
  if (changed) window.scrollTo({ top: 0 });
}

/* =====================================================================
   Démarrage et actualisation automatique
   ===================================================================== */
$('#theme').innerHTML = I.theme;
$('#d-close').innerHTML = I.x;
$('#q').value = '';
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
window.addEventListener('hashchange', route);
window.addEventListener('pagehide', persistSeen);
let lastCheck = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') persistSeen();
  else if (Date.now() - lastCheck > 60e3) { lastCheck = Date.now(); loadData(false); }
});
route();
loadData(true);
setInterval(() => { lastCheck = Date.now(); loadData(false); }, POLL_MS);
setInterval(paintStatus, 30e3);
setInterval(() => { if (!S.detail) render(); }, 15 * 60e3); // changement de jour, libellés relatifs
setInterval(() => { if (loadError) loadData(false); }, 30e3);
})();
</script>
</body>
