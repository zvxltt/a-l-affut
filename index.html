<script>
try {
  // le thème suit l'appareil par défaut : on oublie une seule fois le choix fait avec l'ancien bouton de l'en-tête
  if (!localStorage.getItem('affut:themeV2')) { localStorage.setItem('affut:theme', '"auto"'); localStorage.setItem('affut:themeV2', '1'); }
  const s = JSON.parse(localStorage.getItem('affut:settings') || '{}'), t = JSON.parse(localStorage.getItem('affut:theme') || '"auto"'), r = document.documentElement;
  if (t !== 'auto') r.dataset.theme = t; if (s.text && s.text !== 'normal') r.dataset.text = s.text; if (s.motion === 'reduce') r.dataset.motion = 'reduce'; if (!s.zoom) r.classList.add('nozoom'); } catch (e) {}
</script>
<style>
:root {
  /* Direction : noir et blanc strict, comme le logo ; seules les pochettes apportent la couleur.
     Mise en page : grille de pochettes (albums, EP), liste dense (singles), frise par date (à venir). */
  --bg: #FFFFFF;
  --soft: #F2F2F0;
  --line: #E3E3E0;
  --ink: #0A0A0A;
  --ink-2: #3B3B3A;
  --muted: #6E6E6C;
  --font-display: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --wrap: 1240px;
  --shadow: 0 1px 2px rgba(10, 10, 10, .06), 0 12px 32px rgba(10, 10, 10, .10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0B; --soft: #181817; --line: #272726; --ink: #F4F4F1; --ink-2: #CFCFCB; --muted: #9D9D99;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0B0B; --soft: #181817; --line: #272726; --ink: #F4F4F1; --ink-2: #CFCFCB; --muted: #9D9D99;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font-body); font-stretch: 100%;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
a { color: inherit; }
img { max-width: 100%; display: block; }
svg { flex: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 600; text-decoration: none; }
.skip:focus { top: 12px; }

/* ---------- en-tête ---------- */
.top {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.top-in {
  position: relative; max-width: var(--wrap); margin: 0 auto;
  padding: 12px max(20px, env(safe-area-inset-right)) 12px max(20px, env(safe-area-inset-left));
  display: flex; align-items: center; gap: 28px;
}
.brand { display: flex; align-items: center; flex: none; text-decoration: none; border-radius: 8px; }
.logo { height: 30px; width: auto; display: block; }
.logo-sq { fill: var(--ink); }
.logo-g { stroke: var(--bg); fill: none; }
.logo-d { fill: var(--bg); }
.logo-w { fill: var(--ink); }
.tabs { display: flex; gap: 2px; flex: 1; min-width: 0; }
.tab-sub { margin-left: auto; }
.tab {
  display: inline-flex; align-items: center; gap: 6px;
  font-weight: 600; font-size: 14px; padding: 7px 13px; border-radius: 999px;
  color: var(--muted); text-decoration: none; white-space: nowrap;
  transition: color .15s, background-color .15s;
}
.tab:hover { color: var(--ink); background: var(--soft); }
.tab[aria-current="page"] { color: var(--bg); background: var(--ink); }
.tab .n { font: 600 11px var(--font-mono); opacity: .75; }
.nb { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--ink); color: var(--bg); font: 700 10.5px/18px var(--font-mono); text-align: center; font-variant-numeric: tabular-nums; }
.nb:empty { display: none; }
.tab[aria-current="page"] .nb { background: var(--bg); color: var(--ink); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.icon-btn {
  width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 999px;
  color: var(--ink); transition: background-color .15s;
}
.icon-btn:hover:not(:disabled) { background: var(--soft); }
.icon-btn:disabled { cursor: default; }
.icon-btn svg { width: 18px; height: 18px; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; opacity: 0; transition: opacity .3s; }
.bar.on { opacity: 1; }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .4s ease; }

/* ---------- structure ---------- */
main {
  max-width: var(--wrap); margin: 0 auto; min-height: 60vh;
  padding: 36px max(20px, env(safe-area-inset-right)) 72px max(20px, env(safe-area-inset-left));
}
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 18px 24px; }
.head-main { min-width: 0; flex: 1 1 420px; }
.kicker { font: 600 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.h1 {
  font-family: var(--font-display); font-weight: 800; font-stretch: 116%;
  font-size: clamp(34px, 5.6vw, 64px); line-height: 1; letter-spacing: -0.03em;
  margin: 12px 0 0; text-wrap: balance;
}
.sub { color: var(--ink-2); margin: 14px 0 0; max-width: 64ch; text-wrap: pretty; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font-weight: 600; font-size: 14px; line-height: 1.2;
  text-decoration: none; white-space: nowrap; transition: border-color .15s, background-color .15s, color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.solid:hover:not(:disabled) { background: var(--ink-2); border-color: var(--ink-2); }
.btn.icon { width: 38px; padding: 0; }
.btn svg { width: 16px; height: 16px; }
.stats { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px 26px; margin: 8px 0 0; padding: 0; list-style: none; }
.stats li { display: flex; align-items: baseline; gap: 8px; color: var(--ink-2); font-size: 14px; }
.stats b { font: 600 24px/1 var(--font-mono); color: var(--ink); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.st-j { display: inline-flex; align-items: baseline; gap: 8px; border-radius: 6px; color: inherit; }
.st-j:hover { color: var(--ink); }
.st-j:hover b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }

/* ---------- filtres ---------- */
.ftool { margin: 28px 0 0; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ftoggle {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
  background: var(--soft); color: var(--ink); font-size: 13px; font-weight: 600; transition: background-color .15s, box-shadow .15s;
}
.ftoggle svg { width: 16px; height: 16px; }
.ftoggle:hover { box-shadow: 0 0 0 1px var(--line); }
.ftoggle[aria-expanded="true"] { background: var(--bg); box-shadow: 0 0 0 1px var(--line); }
.fcount:not(:empty) { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--ink); color: var(--bg); font: 600 11px/18px var(--font-mono); text-align: center; }
.filters {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px;
  margin: 0; padding: 14px 0; border-bottom: 1px solid var(--line);
}
.filters[hidden] { display: none; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--soft); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.filters .seg-cc { display: none; }
.filters.v-concerts .seg-cc { display: inline-flex; }
.filters.v-concerts .seg-type { display: none; }
a.row { text-decoration: none; }
.ctime { font: 500 10.5px var(--font-mono); color: var(--muted); letter-spacing: .03em; white-space: nowrap; }
.warn { font-weight: 700; color: var(--ink); }
/* plus de choix à droite : fondu qui invite à faire défiler */
.seg.more { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 34px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 34px), transparent); }
.seg button {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px;
  font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; transition: background-color .15s, color .15s, box-shadow .15s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0, 0, 0, .07); }
.seg .n { font: 500 11px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.search { position: relative; margin-left: auto; flex: 0 1 270px; min-width: 190px; }
.search input {
  width: 100%; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  padding: 0 14px 0 38px; font: 400 14px var(--font-body); -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--ink); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }

/* ---------- sections et pochettes ---------- */
.sec { margin-top: 42px; scroll-margin-top: 86px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 16px; }
.sec-h h2 { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 22px; line-height: 1.1; letter-spacing: -0.015em; margin: 0; }
.sec-h .n { font: 500 13px var(--font-mono); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 30px 20px; }
.card { display: flex; flex-direction: column; gap: 12px; text-align: left; min-width: 0; border-radius: 10px; }
.cover {
  position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden;
  background: var(--soft); container-type: inline-size;
}
.cover::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .16); pointer-events: none; }
.cover img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.card:hover .cover img { transform: scale(1.035); }
.ph {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-stretch: 125%; font-size: 42cqw; line-height: 1; color: var(--muted);
}
.flag {
  position: absolute; z-index: 1; top: 8px; left: 8px; padding: 4px 8px; border-radius: 999px;
  background: var(--ink); color: var(--bg); font: 600 10px/1.2 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
}
.card-t { display: grid; gap: 2px; min-width: 0; }
.card-title { font-weight: 700; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.card-artist { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.card-feat { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.35; }
.card-title, .card-artist, .row-title, .row-artist { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.card-feat { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; }
.feat { color: var(--muted); font-size: 13px; }
.meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; margin-top: 7px;
  font: 500 11px var(--font-mono); letter-spacing: .03em; text-transform: uppercase; color: var(--muted);
}
.pill {
  display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px;
  font: 600 10.5px/1 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
}
.pill.album, .pill.compile { background: var(--ink); color: var(--bg); }
.pill.ep { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
.pill.single { background: var(--soft); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.ex {
  display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 3px; margin-left: 6px; vertical-align: 1px;
  background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font: 700 9px/1 var(--font-mono);
}
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); margin-right: 8px; vertical-align: 2px; }

.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); column-gap: 36px; }
.row {
  position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 14px;
  padding: 10px 10px; margin: 0 -10px; border-radius: 10px; text-align: left; min-width: 0;
  transition: background-color .15s;
}
.row::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 1px; background: var(--line); pointer-events: none; transition: opacity .15s; }
.row:hover { background: var(--soft); }
.row:hover::after { opacity: 0; }
.row .cover { width: 56px; border-radius: 6px; }
.row .ph { font-size: 46cqw; }
.row-t { display: grid; gap: 1px; min-width: 0; }
.row-title { font-weight: 650; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.row-artist { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.row-cat { font: 500 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-top: 3px; }
.row-side {
  display: grid; justify-items: end; gap: 5px; text-align: right;
  font: 500 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
}

/* ---------- à venir ---------- */
.days { margin-top: 30px; }
.day { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 10px 32px; padding: 22px 0; }
.day:first-child { padding-top: 4px; }
.day-h { position: sticky; top: 84px; align-self: start; }
.day-d { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 24px; line-height: 1.05; letter-spacing: -0.02em; }
.day-r { font: 500 12px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
.day-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); column-gap: 36px; }

/* ---------- messages ---------- */
.note {
  margin-top: 28px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; color: var(--ink-2);
}
.note p { margin: 0; flex: 1 1 320px; }
.note strong { color: var(--ink); }
.empty { margin-top: 36px; padding: 52px 24px; border: 1px dashed var(--line); border-radius: 16px; text-align: center; color: var(--ink-2); }
.empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.empty .btn { margin-top: 18px; }
.sk { position: relative; overflow: hidden; background: var(--soft); border-radius: 8px; }
.sk::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--bg) 60%, transparent), transparent);
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }
.sk-card { display: grid; gap: 10px; }
.sk-card .sk:first-child { aspect-ratio: 1 / 1; }

/* ---------- fiche détaillée ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .25s, visibility .25s; }
.drawer {
  position: fixed; z-index: 51; top: 0; right: 0; height: 100%; width: min(520px, 100%);
  background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateX(104%); visibility: hidden; transition: transform .32s cubic-bezier(.2, .8, .2, 1), visibility .32s;
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; pointer-events: none;
}
body.d-open { overflow: hidden; }
body.d-open .scrim { opacity: 1; visibility: visible; pointer-events: auto; }
body.d-open .drawer { transform: none; visibility: visible; pointer-events: auto; }
.d-tools { display: flex; gap: 2px; }
.row-m { display: none; }
.d-bar {
  position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
  padding: calc(10px + env(safe-area-inset-top)) 14px 10px 28px;
  background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.d-cover { width: calc(100% - 56px); margin: 6px 28px 0; border-radius: 10px; box-shadow: var(--shadow); }
.d-main { padding: 24px 28px calc(48px + env(safe-area-inset-bottom)); }
.d-main .meta { margin-top: 0; }
.d-title {
  font-family: var(--font-display); font-weight: 800; font-stretch: 112%;
  font-size: clamp(28px, 4.2vw, 36px); line-height: 1.04; letter-spacing: -0.025em;
  margin: 14px 0 8px; text-wrap: balance; overflow-wrap: anywhere;
}
.d-artist { margin: 0; font-size: 17px; font-weight: 650; }
.d-date { margin: 6px 0 0; color: var(--ink-2); }
.d-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.d-listen { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.btn.sm { min-height: 34px; padding: 0 13px; gap: 6px; font-size: 13.5px; }
.btn.sm svg { width: 14px; height: 14px; }
.d-n { margin-left: 4px; color: var(--ink-2); }
.facts { display: flex; flex-wrap: wrap; gap: 1px; margin: 24px 0 0; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.facts div { flex: 1 1 118px; background: var(--bg); padding: 12px 14px; min-width: 0; }
.facts dt { font: 600 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.facts dd { margin: 5px 0 0; font-weight: 650; overflow-wrap: anywhere; }
.d-h3 { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 30px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--soft); font-size: 13.5px; font-weight: 600; }
.chip .mono { font-size: 11px; color: var(--muted); }
.tracks { list-style: none; margin: 0; padding: 0; }
.trk { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 34px; align-items: center; gap: 10px; padding: 9px 0; box-shadow: inset 0 -1px 0 var(--line); }
.trk.off { opacity: .55; }
.trk-n { font: 500 12px var(--font-mono); color: var(--muted); text-align: right; }
.trk-m { display: grid; min-width: 0; }
.trk-t { font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
.trk-f { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.trk-d { font: 500 12.5px var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.play { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .15s, background-color .15s; }
.play:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.play[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.play svg { width: 12px; height: 12px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.d-msg { color: var(--muted); margin: 18px 0 0; }
.d-src { margin: 26px 0 0; font: 500 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.trk-sk { display: grid; gap: 8px; margin-top: 30px; }

.bnav { display: none; }
#content.enter { animation: enter .28s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 70;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
  box-shadow: var(--shadow); transition: opacity .25s, transform .25s; max-width: calc(100% - 40px); text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.foot {
  max-width: var(--wrap); margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
  padding: 26px max(20px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  border-top: 1px solid var(--line); color: var(--muted); font-size: 13px;
}

@media (max-width: 860px) {
  /* téléphone : en-tête d'une ligne, sections dans la barre du bas, à portée de pouce */
  .top-in { gap: 12px; padding-top: 10px; padding-bottom: 10px; }
  .logo { height: 26px; }
  .tabs, .top .acct { display: none; }
  body { padding-bottom: calc(62px + env(safe-area-inset-bottom)); }
  html { scroll-padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .bnav {
    position: fixed; z-index: 40; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    padding: 5px max(6px, env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
    border-top: 1px solid var(--line);
  }
  .bn {
    display: grid; justify-items: center; gap: 2px; padding: 4px 0 3px; border-radius: 12px;
    color: var(--muted); text-decoration: none; font-size: 10.5px; font-weight: 650; letter-spacing: 0;
    -webkit-tap-highlight-color: transparent; transition: color .15s;
  }
  .bn > svg, .bn-i { box-sizing: content-box; width: 24px; height: 24px; padding: 3px 16px; border-radius: 999px; transition: background-color .2s; }
  .bn-i { display: grid; place-items: center; position: relative; }
  .bn > span:last-child { white-space: nowrap; }   /* « Abonnements » peut déborder un peu de sa colonne : ses voisins sont courts */
  .bn .nb { position: absolute; top: -2px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; font-size: 10px; line-height: 17px; box-shadow: 0 0 0 2px var(--bg); }
  .bn-i svg { width: 24px; height: 24px; }
  .bn[aria-current="page"] { color: var(--ink); }
  .bn[aria-current="page"] > svg, .bn[aria-current="page"] .bn-i { background: var(--soft); }
  body:has(.search input:focus) .bnav { display: none; }
  .toast { bottom: calc(76px + env(safe-area-inset-bottom)); }
  .foot { padding-bottom: 28px; }
  .sec { scroll-margin-top: 66px; }

}
@media (max-width: 760px) {
  main { padding-top: 26px; }
  /* semaine : les flèches remontent sur la ligne du surtitre */

}
@media (max-width: 520px) {

  .row { grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; }
  .row .cover { width: 52px; }
  .row-m { display: block; }
  .row-side .rs { display: none; }
  .d-listen { display: grid; grid-template-columns: 1fr 1fr; }
  .d-listen .btn { justify-content: center; }
  .sec-h { flex-wrap: wrap; }
  .sec-h .toptabs { margin-left: 0; width: 100%; }
  .toptabs button { flex: 1; justify-content: center; }
  .stats { gap: 8px 18px; }
  .stats b { font-size: 20px; }
  .seg button { padding: 6px 9px; font-size: 12.5px; gap: 4px; }
  .d-cover { width: calc(100% - 40px); margin: 4px 20px 0; }
  .d-main { padding-left: 20px; padding-right: 20px; }
  .d-bar { padding-left: 20px; }
}
@media (hover: none) {
  .card:hover .cover img { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- comptes, notes, critiques, profils ---------- */
.acct { display: inline-flex; align-items: center; height: 36px; padding: 0 4px; border-radius: 999px; margin-right: 2px; }
.acct .acct-l { padding: 7px 13px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 650; white-space: nowrap; }
.acct:hover .acct-l { background: var(--ink-2); }
/* photo de profil en haut à droite et dans la barre du bas : fin cercle noir (thème clair) ou blanc (thème sombre) */
.acct.in .av:not(.sk) { box-shadow: inset 0 0 0 1px var(--line), 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }
.acct.in:hover .av:not(.sk) { box-shadow: inset 0 0 0 1px var(--line), 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink), 0 0 0 7px var(--soft); }
#bn-av .av { box-shadow: inset 0 0 0 1px var(--line), 0 0 0 1.5px var(--bg), 0 0 0 2.75px var(--ink); }
.bn[aria-current="page"] #bn-av .av { box-shadow: inset 0 0 0 1px var(--line), 0 0 0 1.5px var(--soft), 0 0 0 2.75px var(--ink); }
.av { display: inline-grid; place-items: center; flex: none; border-radius: 50%; overflow: hidden; background: var(--soft); color: var(--ink-2); font-weight: 750; box-shadow: inset 0 0 0 1px var(--line); }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.sm { width: 30px; height: 30px; font-size: 13px; }
.av.xs { width: 24px; height: 24px; font-size: 11px; }
.av.xl { width: 92px; height: 92px; font-size: 38px; }
.av.lg { width: 56px; height: 56px; font-size: 22px; }
.av.xxl { width: 132px; height: 132px; font-size: 52px; }
/* ---------- photo de profil ---------- */
.prof-av, .ph-mini { position: relative; display: inline-grid; padding: 0; border-radius: 50%; flex: none; }
.prof-av .av, .ph-mini .av { transition: filter .15s; }
.prof-av:hover .av, .ph-mini:hover .av { filter: brightness(.9); }
.prof-cam { position: absolute; right: 0; bottom: 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); box-shadow: 0 0 0 3px var(--bg); }
.prof-cam svg { width: 15px; height: 15px; }
.ph-mini .prof-cam { width: 22px; height: 22px; right: -2px; bottom: -2px; box-shadow: 0 0 0 2px var(--bg); }
.ph-mini .prof-cam svg { width: 12px; height: 12px; }
.fld-ph { display: flex; align-items: center; gap: 16px; margin: 0 0 18px; }
.fld-ph > div { display: grid; gap: 8px; justify-items: start; }
.fld-ph b { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.ph-now { display: grid; place-items: center; margin: 4px 0 22px; }
.ph-acts { display: grid; gap: 8px; }
.ph-pick { position: relative; overflow: hidden; cursor: pointer; }
.ph-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.ph-pick:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.crop { position: relative; width: var(--s); height: var(--s); margin: 4px auto 0; overflow: hidden; border-radius: 18px; background: var(--soft); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.crop.drag { cursor: grabbing; }
.crop img { position: absolute; left: 50%; top: 50%; max-width: none; pointer-events: none; -webkit-user-drag: none; }
.crop::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255, 255, 255, .92), 0 0 0 999px rgba(0, 0, 0, .5); pointer-events: none; }
.crop-z { display: flex; align-items: center; gap: 10px; width: var(--s, 240px); max-width: 100%; margin: 16px auto 0; color: var(--muted); }
.crop-z svg { width: 18px; height: 18px; flex: none; }
.crop-z input { flex: 1; accent-color: var(--ink); }
.av.sk { background: var(--line); animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .45; } }
.muted { color: var(--muted); }

.stars { position: relative; display: inline-block; width: max-content; justify-self: start; line-height: 1; font-size: 15px; letter-spacing: 1px; color: var(--line); white-space: nowrap; vertical-align: -1px; }
.stars .on { position: absolute; inset: 0 auto 0 0; width: var(--v); overflow: hidden; color: var(--ink); }
.stars.sm { font-size: 12.5px; }
.stars.xs { font-size: 11.5px; letter-spacing: .5px; }
.rt { font: 650 11px var(--font-mono); color: var(--ink); background: var(--soft); border-radius: 999px; padding: 2px 7px; letter-spacing: .02em; }

.rb { margin-top: 6px; }
.rb-sum { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: end; gap: 22px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; }
.rb-avg { display: grid; gap: 6px; }
.rb-avg b { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 40px; line-height: .9; letter-spacing: -0.03em; }
.rb-avg .stars { font-size: 17px; }
.rb-avg > span:last-child { font: 500 11.5px var(--font-mono); color: var(--muted); }
.hist { display: grid; grid-template-columns: repeat(10, 1fr); align-items: end; gap: 3px; height: 56px; }
.hist span { height: max(3px, var(--h)); border-radius: 3px 3px 1px 1px; background: var(--ink); opacity: .85; }
.rb-empty, .rb-note { color: var(--ink-2); margin: 0; font-size: 14.5px; }
.rb-note { margin-top: 14px; color: var(--muted); }
.rb-mine { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-weight: 650; }
.rb-cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 14px 16px; border-radius: 14px; background: var(--soft); }
.rb-cta p { margin: 0; font-size: 14.5px; }
.rb-form { margin-top: 16px; display: grid; gap: 12px; }
.rate-row { display: flex; align-items: center; gap: 14px; }
.rate-in { position: relative; display: inline-block; font-size: 36px; line-height: 1; letter-spacing: 3px; color: var(--line); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 8px; }
.rate-in .on { position: absolute; inset: 0 auto 0 0; width: var(--v); overflow: hidden; color: var(--ink); white-space: nowrap; }
.rate-in:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
.rate-val { font: 650 15px var(--font-mono); color: var(--ink-2); min-width: 4ch; }
.rb-form textarea, .fld input, .fld textarea, .m-search {
  width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font: inherit; font-size: 15px; padding: 11px 13px; resize: vertical;
}
.rb-form textarea:focus, .fld input:focus, .fld textarea:focus, .m-search:focus { outline: none; border-color: var(--ink); }
.rb-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.rb-hint { margin-left: auto; font: 500 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.rb-more { margin: 12px 0 0; color: var(--muted); font-size: 13.5px; }
.rb-tip { margin: 0; color: var(--muted); font-size: 13.5px; }
.rb-mine .btn { margin-left: auto; min-height: 32px; padding: 0 13px; font-size: 13px; }

/* notes des sons, dans la tracklist */
.trk-st { margin-left: 10px; text-transform: none; letter-spacing: 0; color: var(--ink-2); }
.trk-hint { margin: -2px 0 8px; color: var(--muted); font-size: 13px; line-height: 1.45; }
.trk-x { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 12px; margin-top: 4px; }
.trk-x:empty { display: none; }
.trate { position: relative; display: inline-block; font-size: 19px; line-height: 1.5; letter-spacing: 2px; color: var(--line); cursor: pointer; touch-action: pan-y; user-select: none; -webkit-user-select: none; border-radius: 6px; white-space: nowrap; }
.trate .on { position: absolute; inset: 0 auto 0 0; width: var(--v); overflow: hidden; color: var(--ink); }
.trate:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.trate-v { font: 650 12px var(--font-mono); color: var(--ink-2); margin-left: -6px; min-width: 3ch; }
.trate-v:empty { display: none; }
.trk-mine { display: inline-flex; align-items: center; }
.trk-avg { display: inline-flex; align-items: baseline; gap: 5px; font: 650 11.5px var(--font-mono); color: var(--ink); background: var(--soft); border-radius: 999px; padding: 2px 8px; }
.trk-avg small { font-size: 10px; font-weight: 500; color: var(--muted); }
.trk.hl { animation: trk-hl 2.6s ease-out; }
@keyframes trk-hl { 0%, 55% { background: var(--soft); box-shadow: inset 3px 0 0 var(--ink), inset 0 -1px 0 var(--line); } 100% { background: transparent; } }
.rv-list { display: grid; gap: 0; margin-top: 18px; border-top: 1px solid var(--line); }
.rv { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.rv.own { background: linear-gradient(90deg, var(--soft), transparent 70%); padding-left: 10px; margin-left: -10px; border-radius: 10px 0 0 10px; }
.rv-who { display: flex; align-items: center; gap: 9px; text-decoration: none; min-width: 0; }
.rv-who b { font-size: 14.5px; }
.rv-who span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-who em { font: 600 10px var(--font-mono); font-style: normal; text-transform: uppercase; letter-spacing: .06em; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 2px 7px; }
.rv-who:hover b { text-decoration: underline; }
.rv-meta { display: flex; align-items: center; gap: 10px; font: 500 11.5px var(--font-mono); color: var(--muted); }
.rv-tx { margin: 0; white-space: pre-line; overflow-wrap: anywhere; line-height: 1.55; font-size: 15px; }
.rv-tx.clamp { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.rv-more { justify-self: start; font-size: 13.5px; font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
.rv-rel { display: flex; align-items: center; gap: 12px; text-align: left; min-width: 0; }
.rv-rel .cover { width: 52px; flex: none; border-radius: 6px; }
.rv-rel b { display: block; font-size: 15px; }
.rv-rel span span { color: var(--ink-2); font-size: 13.5px; }
.rv-list.wide { max-width: 760px; }

.cta { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-top: 30px; padding: 18px 58px 18px 20px; border-radius: 16px; background: var(--soft); }
.cta-x { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; color: var(--muted); }
.cta-x:hover { color: var(--ink); background: var(--bg); }
.cta p { margin: 0; max-width: 62ch; color: var(--ink-2); }
.cta b { color: var(--ink); }
.toprated { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 4px 36px; }
.tr { width: 100%; display: grid; grid-template-columns: 30px 56px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 10px; margin: 0 -10px; border-radius: 12px; text-align: left; }
.tr:hover { background: var(--soft); }
.tr-n { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 26px; color: var(--muted); text-align: center; }
.tr .cover { width: 56px; border-radius: 6px; }
.tr-t { display: grid; gap: 2px; min-width: 0; }
.tr-t b { font-size: 15px; overflow-wrap: anywhere; }
.tr-t span { color: var(--ink-2); font-size: 13.5px; overflow-wrap: anywhere; }
.tr-s { display: grid; justify-items: end; gap: 4px; }
.tr-s b { font: 700 18px var(--font-mono); letter-spacing: -0.02em; }
.tr-s > span:last-child:not(.stars) { font: 500 10.5px var(--font-mono); color: var(--muted); }
.tr-s .stars { justify-self: end; }
.sec-h .toptabs { margin-left: auto; align-self: center; }
.more-row { margin: 14px 0 0; }

.prof { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 22px; flex-basis: 100%; }
.prof .h1 { margin-top: 4px; }
.prof-meta { margin: 6px 0 0; font: 500 13px var(--font-mono); color: var(--muted); }
.prof-bio { white-space: pre-line; }
.prof .actions { align-self: start; flex-wrap: wrap; justify-content: flex-end; }
.vit { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.vit-item { position: relative; }
.vit-item .card { width: 100%; }
.vit-x { position: absolute; top: 8px; right: 8px; background: var(--bg); box-shadow: 0 1px 4px rgba(0, 0, 0, .2); width: 32px; height: 32px; }
.vit-add { aspect-ratio: 1; display: grid; place-content: center; justify-items: center; gap: 6px; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 14px; font-weight: 600; }
.vit-add span { font-size: 34px; line-height: 1; font-weight: 300; }
.vit-add:hover { border-color: var(--ink); color: var(--ink); }
.grid.sm { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 24px 16px; }
.grid.sm .card-title { font-size: 14px; }
.grid.sm .card-artist { font-size: 13px; }
.dist { display: flex; align-items: end; gap: 10px; max-width: 360px; margin: 0 0 22px; }
.dist .hist { flex: 1; height: 44px; }
.dist-l { font: 600 12px var(--font-mono); color: var(--muted); }
body[data-view="profil"] .ftool, body[data-view="user"] .ftool { display: none; }
body[data-view="profil"] .filters, body[data-view="user"] .filters { display: none; }

.modal { width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); border: 0; border-radius: 20px; padding: 0; background: var(--bg); color: var(--ink); box-shadow: 0 24px 80px rgba(0, 0, 0, .35); }
.modal::backdrop { background: rgba(10, 10, 10, .5); backdrop-filter: blur(3px); }
.m-in { position: relative; padding: 30px 28px 26px; }
.m-x { position: absolute; top: 14px; right: 14px; }
.m-title { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 26px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 40px 10px 0; }
.m-sub { color: var(--ink-2); margin: 0 0 20px; }
.m-fine { color: var(--muted); font-size: 12.5px; margin: 18px 0 0; }
.m-err { color: #C62828; font-size: 13.5px; margin: 4px 0 0; min-height: 1.2em; }
.m-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.m-danger { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
.btn.google { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 48px; font-size: 15px; font-weight: 650; border-color: var(--line); }
.empty .btn.google { width: auto; padding: 0 22px; }
.btn.google svg { width: 20px; height: 20px; }
.btn.danger { color: #C62828; border-color: rgba(198, 40, 40, .35); }
.btn.danger:hover:not(:disabled) { border-color: #C62828; }
.fld { display: grid; gap: 6px; margin-bottom: 14px; }
.fld > span:first-child { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.fld small { color: var(--muted); font-size: 12.5px; }
.fld-at { position: relative; display: block; }
.fld-at b { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; }
.fld-at input { padding-left: 30px; }
.m-search { margin-bottom: 12px; }
.pick-list { display: grid; gap: 2px; max-height: min(52vh, 460px); overflow-y: auto; margin: 0 -8px; }
.pick { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; text-align: left; }
.pick:hover:not(:disabled) { background: var(--soft); }
.pick:disabled { opacity: .5; cursor: default; }
.pick .cover { width: 48px; border-radius: 6px; }
.pick-t { display: grid; min-width: 0; }
.pick-t b { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-t span { color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-in { font: 500 10.5px var(--font-mono); color: var(--muted); }
@media (max-width: 760px) {
  .prof { grid-template-columns: auto minmax(0, 1fr); }
  .prof .actions { grid-column: 1 / -1; justify-content: flex-start; }
  .vit { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .av.xl { width: 72px; height: 72px; font-size: 30px; }
}
@media (max-width: 520px) {
  .acct .acct-l { padding: 6px 11px; font-size: 12.5px; }
  .rb-sum { grid-template-columns: 1fr; }
  .rb-hint { margin-left: 0; width: 100%; }
  .tr { grid-template-columns: 24px 48px minmax(0, 1fr) auto; gap: 10px; }
  .tr .cover { width: 48px; }
  .toprated { grid-template-columns: minmax(0, 1fr); }
  .m-in { padding: 26px 20px 20px; }
  .rate-in { font-size: 40px; }
}

/* ---------- paramètres ---------- */
html[data-text="grand"] body { zoom: 1.1; }
html[data-text="tres-grand"] body { zoom: 1.22; }
html[data-motion="reduce"] *, html[data-motion="reduce"] *::before, html[data-motion="reduce"] *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
html.nozoom, html.nozoom body { touch-action: pan-x pan-y; }
#gear.on { background: var(--soft); }
body[data-view="parametres"] .ftool, body[data-view="parametres"] .filters,
body[data-view="abonnements"] .ftool, body[data-view="abonnements"] .filters { display: none; }
.set-sec { margin-top: 34px; max-width: 760px; }
.set-h { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 4px; }
.set-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.set-t { display: grid; gap: 3px; flex: 1 1 260px; min-width: 0; }
.set-t b { font-size: 15.5px; }
.set-t span { color: var(--muted); font-size: 13.5px; line-height: 1.45; overflow-wrap: anywhere; }
.set-c { flex: none; max-width: 100%; }
.set-c .seg { flex-wrap: wrap; overflow: visible; border-radius: 18px; }
.set-about { color: var(--ink-2); line-height: 1.6; margin: 8px 0 0; }
.sw { position: relative; width: 50px; height: 30px; border-radius: 999px; background: var(--line); transition: background-color .2s; }
.sw span { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--ink); }
.sw[aria-checked="true"] span { transform: translateX(20px); }
/* ---------- connexion par e-mail ---------- */
.m-or { display: flex; align-items: center; gap: 12px; margin: 20px 0 14px; color: var(--muted); font-size: 12.5px; }
.m-or::before, .m-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.m-split { justify-content: space-between; align-items: center; }
.m-switch { margin: 16px 0 0; font-size: 13.5px; color: var(--ink-2); }
.btn-link { font-size: 13.5px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
/* ---------- abonnements ---------- */
.av.md { width: 40px; height: 40px; font-size: 16px; }
.people { display: grid; margin-top: 8px; }
.person { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.person-l { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: inherit; }
.person-l > span { display: grid; min-width: 0; }
.person-l b { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person-l span span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person-l small { font: 600 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person-l:hover b { text-decoration: underline; text-underline-offset: 2px; }

.people-empty { padding: 18px 0; margin: 0; }
.btn.fol { min-width: 118px; }
.btn.fol.sm { min-width: 108px; flex: none; }
.btn.fol .fol-b { display: none; }

  .btn.fol.on:hover .fol-a { display: none; }
  .btn.fol.on:hover .fol-b { display: inline; }
}
.prof-fol, .feed-stats { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; margin: 14px 0 0; font-size: 14px; }
.prof-fol { margin-top: -2px; }
.prof-fol a, .feed-stats a { color: var(--ink-2); text-decoration: none; }
.prof-fol b, .feed-stats b { color: var(--ink); font: 600 15px var(--font-mono); font-variant-numeric: tabular-nums; margin-right: 2px; }
.prof-fol a:hover, .feed-stats a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.prof-tag { font: 600 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; background: var(--soft); color: var(--ink-2); }
.back { display: inline-flex; align-items: center; gap: 2px; margin-left: -6px; padding: 4px 10px 4px 2px; border-radius: 999px; color: var(--ink-2); font-weight: 600; font-size: 14px; text-decoration: none; }
.back:hover { color: var(--ink); background: var(--soft); }
.back svg { width: 18px; height: 18px; }
.seg a { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; text-decoration: none; transition: background-color .15s, color .15s, box-shadow .15s; }
.seg a:hover { color: var(--ink); }
.seg a[aria-current="page"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0, 0, 0, .07); }
.people-tabs { margin-top: 30px; }
body[data-view="abonnements"] main { padding-bottom: 8px; }
.feed-wrap {
  display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto 1fr;
  grid-template-areas: "main find" "main sug"; column-gap: 56px; align-items: start; margin-top: 32px;
}
.feed-main { grid-area: main; min-width: 0; max-width: 680px; }
.feed-main > .empty:first-child { margin-top: 0; }
.feed-find { grid-area: find; min-width: 0; }
.feed-sug { grid-area: sug; min-width: 0; margin-top: 34px; }
.side-h { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
.feed-find .search { margin: 0; max-width: none; min-width: 0; flex: none; }
.feed-find .people > .muted { margin: 10px 0 0; font-size: 14px; }
.feed-sk { display: grid; gap: 14px; }
.feed-sk .sk { height: 156px; border-radius: 14px; }
.posts { margin-top: 14px; border-top: 1px solid var(--line); }
.post { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; padding: 18px 0 20px; border-bottom: 1px solid var(--line); }
.post-av { text-decoration: none; }
.post-b { display: grid; gap: 10px; min-width: 0; }
.post-h { display: flex; align-items: baseline; gap: 6px; min-width: 0; margin: 0; font-size: 13px; color: var(--muted); }
.post-h a { color: var(--ink); text-decoration: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; }
.post-h a:hover b { text-decoration: underline; text-underline-offset: 2px; }
.post-h b { font-size: 15px; }
.post-h > span:first-of-type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto; }
.post-h time { flex: none; font-variant-numeric: tabular-nums; }
.post-a { margin: -8px 0 0; font-size: 13.5px; color: var(--ink-2); }
.post-rel {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 10px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--bg); color: inherit; transition: border-color .15s;
}
@media (hover: hover) { .post-rel:hover { border-color: var(--ink); } }
.post-rel:active { border-color: var(--ink); }
.post-rel .cover { width: 64px; flex: none; border-radius: 8px; }
.post-rt { display: grid; gap: 3px; min-width: 0; }
.post-rt b { font-size: 15.5px; line-height: 1.25; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.post-rt > span:not(.post-n) { color: var(--ink-2); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post-n { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 3px; }
.post-n i { font: 600 12.5px var(--font-mono); font-style: normal; font-variant-numeric: tabular-nums; }
.post-n em { font: 500 11.5px var(--font-mono); font-style: normal; color: var(--muted); }
.post-n .post-best { color: var(--ink-2); font: 500 13px var(--font-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.post-n .post-best b { font: 600 12.5px var(--font-mono); color: var(--ink); }
.post-tx { margin: 0; white-space: pre-line; overflow-wrap: anywhere; line-height: 1.55; font-size: 15px; }
.post-tx.clamp { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.feed-more { text-align: center; margin-top: 22px; }
@media (max-width: 860px) {
  .feed-wrap { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "find" "main" "sug"; margin-top: 22px; }
  .feed-main { max-width: none; margin-top: 26px; }
  .feed-sug { margin-top: 40px; }
}

}

.set-st .live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: 1px; opacity: .7; }

/* =====================================================================
   Outils
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const isYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
// Les sorties tombent le vendredi : une semaine va du vendredi au jeudi.
const weekStartOf = s => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 2) % 7)); return ymd(d); };

const DOW = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const DOW_S = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const MON = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MON_S = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const dnum = n => (n === 1 ? '1er' : String(n));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const yearSuffix = d => (d.getFullYear() !== new Date().getFullYear() ? ` ${d.getFullYear()}` : '');
const fmtShort = s => { const d = parseYmd(s); return `${DOW_S[d.getDay()]} ${d.getDate()} ${MON_S[d.getMonth()]}`; };
const fmtDay = s => { const d = parseYmd(s); return `${DOW[d.getDay()]} ${dnum(d.getDate())} ${MON[d.getMonth()]}${yearSuffix(d)}`; };
const fmtLong = s => { const d = parseYmd(s); return `${DOW[d.getDay()]} ${dnum(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
function fmtRange(a, b) {
  const A = parseYmd(a), B = parseYmd(b);
  if (A.getFullYear() !== B.getFullYear()) return `${dnum(A.getDate())} ${MON[A.getMonth()]} ${A.getFullYear()} – ${dnum(B.getDate())} ${MON[B.getMonth()]} ${B.getFullYear()}`;
  if (A.getMonth() !== B.getMonth()) return `${dnum(A.getDate())} ${MON[A.getMonth()]} – ${dnum(B.getDate())} ${MON[B.getMonth()]}${yearSuffix(B)}`;
  return `${dnum(A.getDate())} – ${dnum(B.getDate())} ${MON[B.getMonth()]}${yearSuffix(B)}`;
}
function relLabel(s) {
  const n = daysBetween(today(), s);
  if (n === 0) return 'aujourd’hui';
  if (n === 1) return 'demain';
  if (n === -1) return 'hier';
  if (n > 1 && n < 14) return `dans ${n} jours`;
  if (n >= 14 && n < 56) return `dans ${Math.round(n / 7)} semaines`;
  if (n >= 56) return `dans ${Math.max(2, Math.round(n / 30.4))} mois`;
  if (n < -1 && n > -14) return `il y a ${-n} jours`;
  if (n <= -14 && n > -60) return `il y a ${Math.round(-n / 7)} semaines`;
  return '';
}
function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60e3));
  if (m < 1) return 'à l’instant';
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  return h < 24 ? `il y a ${h} h` : `il y a ${Math.round(h / 24)} j`;
}
const fmtDur = sec => { sec = Math.round(sec || 0); return `${Math.floor(sec / 60)}:${pad(sec % 60)}`; };
const fmtTotal = sec => { const m = Math.round((sec || 0) / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${pad(m % 60)}`; };
const initial = s => ((String(s || '?').trim().match(/[\p{L}\p{N}]/u) || ['?'])[0]).toUpperCase();
const baseTitle = s => String(s || '').replace(/\s*[(\[][^)\]]*(deluxe|edition|édition|version|bonus|remaster|réédition|extended)[^)\]]*[)\]]/ig, '').trim();
const plural = (n, one, many) => (n > 1 ? many : one);
const store = {
  get(k, d) { try { const v = localStorage.getItem(`affut:${k}`); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(`affut:${k}`, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
};
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('on'), 2600);
}
function coverUrl(r, size) {
  if (r.md5) return `https://cdn-images.dzcdn.net/images/cover/${r.md5}/${size}x${size}-000000-80-0-0.jpg`;
  if (r.cover) return r.cover.replace(/\{s\}/g, String(Math.min(size, 1000)));
  return '';
}

/* =====================================================================
   Données (préparées toutes les heures par le robot sur GitHub)
   ===================================================================== */
let DATA = { generatedAt: '', items: [], byKey: new Map(), artists: 0 };
let DETAILS = null, detailsFor = '';
let loadError = false;
const prefs = store.get('prefs', {});
const SET = Object.assign({ zoom: false, text: 'normal', motion: 'auto', start: 'a-venir', news: true }, store.get('settings', {}));
const S = {
  view: 'a-venir', week: 0,
  cat: CATS[prefs.cat] ? prefs.cat : 'all',
  type: TYPE_LABEL[prefs.type] ? prefs.type : 'all',
  cc: COUNTRY[prefs.cc] ? prefs.cc : 'all',
  q: '', detail: null, handle: '', sub: '',
  open: new Set(),   // sections dépliées en entier (« semaine:section »)
};
if (!['a-venir', 'semaine', 'concerts', 'abonnements'].includes(SET.start)) SET.start = 'a-venir';

function mapItem(x) {
  return {
    key: x.k, title: x.t, artist: x.a, feats: x.f || [], date: x.d, rt: TYPE_LABEL[x.rt] ? x.rt : 'album', cat: x.c,
    md5: x.cv || '', cover: x.cu || '', n: x.n || 0, dur: x.du || 0, label: x.lb || '', genre: x.g || '', ex: !!x.ex,
    pop: x.p || 0, src: [...new Set((x.s || []).map(s => (s === 'an' ? 'pr' : s)))], dz: x.dz || 0, am: x.am || '', mb: x.mb || '',
    article: x.pl || x.src || '', outlet: x.po || '',
  };
}
async function loadData(first) {
  try {
    const r = await fetch(DATA_URL, { cache: 'no-cache' });   // revalidation : toujours la dernière version publiée
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    loadError = false;
    if (j.generatedAt === DATA.generatedAt) { paintStatus(); return; }
    const before = new Set(DATA.items.map(x => x.key));
    const items = (j.items || []).filter(x => isYmd(x.d) && CATS[x.c]).map(mapItem);
    const added = DATA.items.length ? items.filter(x => !before.has(x.key)).length : 0;
    DATA = { generatedAt: j.generatedAt, items, byKey: new Map(items.map(x => [x.key, x])), artists: j.artists || 0 };
    if (CONCERTS.loaded && CONCERTS.generatedAt !== j.generatedAt) loadConcerts(true);
    render();
    if (pendingFiche) openFiche(pendingFiche);
    if (added > 0) toast(`${added} ${plural(added, 'nouvelle sortie', 'nouvelles sorties')} à l’instant`);
  } catch (e) {
    loadError = true;
    if (!DATA.items.length) render();
    paintStatus();
  }
}
// Concerts : fichier à part, chargé à la première visite de l’onglet puis à chaque mise à jour du robot
let CONCERTS = { generatedAt: '', updatedAt: null, items: [], loaded: false };
function mapConcert(x) {
  return {
    key: `c${x.id}`, date: x.d, time: x.h || '', name: x.n || '', artists: x.a || [], cat: x.c, venue: x.v || '', city: x.ci || '',
    cc: x.cc || '', url: x.u || '', img: x.im || '', price: x.pr || 0, status: x.st || '', fest: !!x.fe, pop: x.p || 0,
  };
}
async function loadConcerts(force) {
  if (CONCERTS.loaded && !force) return;
  try {
    const r = await fetch(CONCERTS_URL, { cache: 'no-cache' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    CONCERTS = { generatedAt: j.generatedAt, updatedAt: j.updatedAt, items: (j.items || []).filter(x => isYmd(x.d) && CATS[x.c]).map(mapConcert), loaded: true };
  } catch (e) {
    if (!CONCERTS.loaded) CONCERTS = { generatedAt: '', updatedAt: null, items: [], loaded: true };
  }
  if (S.view === 'concerts' && !S.detail) render(); else paintStatus();
}
async function loadDetails() {
  if (DETAILS && detailsFor === DATA.generatedAt) return DETAILS;
  const r = await fetch(DETAILS_URL, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  DETAILS = await r.json();
  detailsFor = DATA.generatedAt;
  return DETAILS;
}

// « Nouveau » = apparu depuis ta dernière visite
const prevSeen = new Set(store.get('seen', []));
const firstEver = prevSeen.size === 0;
const isNew = r => SET.news && !firstEver && !prevSeen.has(r.key) && r.date >= addDays(today(), -10);
function persistSeen() {
  if (!DATA.items.length) return;
  store.set('seen', [...new Set([...DATA.items.map(x => x.key), ...prevSeen])].slice(0, 8000));
}

/* =====================================================================
   Affichage
   ===================================================================== */
const $head = $('#head'), $content = $('#content'), $filters = $('#filters');
let INDEX = new Map();

const statusHtml = () => loadError && !DATA.items.length ? 'Connexion impossible'
  : DATA.generatedAt ? `<span class="live" aria-hidden="true"></span>Mis à jour ${esc(ago(DATA.generatedAt))}` : 'Chargement…';
function paintStatus() {
  const st = $('#set-st');   // l’heure de mise à jour n’est affichée que dans les paramètres
  if (st) st.innerHTML = statusHtml();
  const up = DATA.items.filter(x => x.date > today()).length;
  $('#up-n').textContent = up ? up : '';
  const co = CONCERTS.items.filter(x => x.date >= today()).length;
  $('#co-n').textContent = co ? co : '';
  if (DATA.artists) $('#foot-l').textContent = `À l’affût · ${DATA.artists.toLocaleString('fr-FR')} artistes suivis, dont le top 150 France`;
}

const matchQ = (r, q) => !q || norm(`${r.title} ${r.artist} ${r.feats.join(' ')}`).includes(q);
const matchType = r => S.type === 'all' || r.rt === S.type || (S.type === 'album' && r.rt === 'compile');
const matchCat = r => S.cat === 'all' || r.cat === S.cat;
const applyFilters = list => { const q = norm(S.q); return list.filter(r => matchCat(r) && matchType(r) && matchQ(r, q)); };
function elsewhereHtml(base) {
  const q = norm(S.q);
  if (q.length < 2) return '';
  const here = new Set(base.map(r => r.key)), t = today(), lo = addDays(weekStartOf(t), -MAX_BACK * 7);
  const hits = DATA.items.filter(r => !here.has(r.key) && r.date >= lo && matchCat(r) && matchType(r) && matchQ(r, q))
    .sort((a, b) => Math.abs(daysBetween(t, a.date)) - Math.abs(daysBetween(t, b.date)) || b.pop - a.pop).slice(0, 8);
  return hits.length ? section('Ailleurs sur le site', hits.length, `<div class="rows">${hits.map(r => rowHtml(r, false)).join('')}</div>`) : '';
}
function paintFilters(base) {
  const q = norm(S.q);
  const cc = { all: 0, rfr: 0, rus: 0, mfr: 0, int: 0 }, tc = { all: 0, album: 0, ep: 0, single: 0 };
  for (const r of base) {
    if (!matchQ(r, q)) continue;
    if (matchType(r)) { cc.all++; cc[r.cat]++; }
    if (matchCat(r)) { tc.all++; tc[r.rt === 'compile' ? 'album' : r.rt]++; }
  }
  $$('[data-cat]', $filters).forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.cat === S.cat)); b.querySelector('.n').textContent = cc[b.dataset.cat] || 0; });
  $$('[data-type]', $filters).forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.type === S.type)); b.querySelector('.n').textContent = tc[b.dataset.type] || 0; });
  fadeSegs(true);
}
// filtres qui débordent sur mobile : fondu à droite tant qu’il reste des choix cachés ; après un choix, le filtre actif reste visible
function paintToggle() {
  const n = (S.cat !== 'all') + (S.view === 'concerts' ? S.cc !== 'all' : S.type !== 'all') + !!S.q.trim();
  $('#fcount').textContent = n ? n : '';
}
function fadeSegs(reveal) {
  $$('.seg', $filters).forEach(s => {
    const on = reveal && s.querySelector('[aria-pressed="true"]');
    if (on && (on.offsetLeft < s.scrollLeft || on.offsetLeft + on.offsetWidth > s.scrollLeft + s.clientWidth)) s.scrollLeft = on.offsetLeft - 8;
    s.classList.toggle('more', s.scrollLeft + s.clientWidth < s.scrollWidth - 2);
  });
}
addEventListener('resize', () => fadeSegs(), { passive: true });
document.addEventListener('scroll', e => { if (e.target.classList && e.target.classList.contains('seg')) fadeSegs(); }, { capture: true, passive: true });
function countTypes(list) {
  const c = { album: 0, ep: 0, single: 0 };
  for (const r of list) c[r.rt === 'compile' ? 'album' : r.rt]++;
  return c;
}
// une statistique peut mener à sa section (« 21 albums » descend jusqu’aux albums)
const statsHtml = pairs => `<ul class="stats">${pairs.filter((p, i) => i === 0 || p[0]).map(([n, l, jump]) => jump
  ? `<li><button class="st-j" type="button" data-jump="${jump}" title="Aller à la section"><b>${n}</b>${esc(l)}</button></li>`
  : `<li><b>${n}</b>${esc(l)}</li>`).join('')}</ul>`;
const section = (title, n, inner, id) => `<section class="sec"${id ? ` id="${id}"` : ''}><div class="sec-h"><h2>${esc(title)}</h2><span class="n">${n}</span></div>${inner}</section>`;
const srcText = r => r.src.map(s => SRC_LABEL[s]).filter(Boolean).join(' · ');
function coverHtml(r, size) {
  const url = coverUrl(r, size);
  return url ? `<img src="${esc(url)}" alt="" loading="lazy" decoding="async">` : `<span class="ph" aria-hidden="true">${esc(initial(r.title))}</span>`;
}
function cardHtml(r) {
  INDEX.set(r.key, r);
  const flag = isNew(r) ? 'Nouveau' : r.date > today() ? relLabel(r.date) : '';
  return `<button class="card" type="button" data-key="${esc(r.key)}">
    <span class="cover">${coverHtml(r, 500)}${flag ? `<span class="flag">${esc(flag)}</span>` : ''}</span>
    <span class="card-t">
      <span class="card-title">${esc(r.title)}${r.ex ? '<span class="ex" title="Explicite">E</span>' : ''}</span>
      <span class="card-artist">${esc(r.artist)}</span>
      ${r.feats.length ? `<span class="card-feat">feat. ${esc(r.feats.join(', '))}</span>` : ''}
      <span class="meta">${rtChip(r)}<span>${esc(CATS[r.cat])}</span><span>${esc(fmtShort(r.date))}</span>${r.n > 1 ? `<span>${r.n} titres${r.dur ? ` · ${fmtTotal(r.dur)}` : ''}</span>` : ''}</span>
    </span>
  </button>`;
}
function rowHtml(r, upcoming) {
  INDEX.set(r.key, r);
  const len = r.n > 1 ? `${r.n} titres` : r.dur ? fmtDur(r.dur) : '';
  const side = upcoming
    ? `<span class="pill ${esc(r.rt)}">${esc(TYPE_LABEL[r.rt])}</span>`
    : `${FB_CONFIG ? rtChip(r) : ''}<span class="rs">${esc(fmtShort(r.date))}</span><span class="rs">${esc(CATS[r.cat])}${len ? ` · ${esc(len)}` : ''}</span>`;
  return `<button class="row" type="button" data-key="${esc(r.key)}">
    <span class="cover">${coverHtml(r, 120)}</span>
    <span class="row-t">
      <span class="row-title">${isNew(r) ? '<span class="dot" title="Nouveau depuis ta dernière visite"></span>' : ''}${esc(r.title)}${r.ex ? '<span class="ex" title="Explicite">E</span>' : ''}</span>
      <span class="row-artist">${esc(r.artist)}${r.feats.length ? ` <span class="feat">· feat. ${esc(r.feats.join(', '))}</span>` : ''}</span>
      ${upcoming ? `<span class="row-cat">${esc(CATS[r.cat])}</span>` : `<span class="row-cat row-m">${esc(CATS[r.cat])}${len ? ` · ${esc(len)}` : ''} · ${esc(fmtShort(r.date))}</span>`}
    </span>
    <span class="row-side">${side}</span>
  </button>`;
}
function skeletonHtml() {
  const card = '<div class="sk-card"><div class="sk"></div><div class="sk" style="height:14px;width:80%"></div><div class="sk" style="height:12px;width:55%"></div></div>';
  return section('Albums', '…', `<div class="grid">${card.repeat(6)}</div>`);
}
function emptyHtml(kind) {
  if (!DATA.items.length) {
    return loadError
      ? '<div class="empty"><strong>Les sorties n’ont pas pu être chargées.</strong>Vérifie ta connexion : le site réessaie tout seul dans un instant.</div>'
      : skeletonHtml();
  }
  if (kind === 'filters') return '<div class="empty"><strong>Aucune sortie avec ces filtres.</strong>Essaie un autre genre ou un autre format.<br><button class="btn" type="button" data-reset>Tout afficher</button></div>';
  if (kind === 'week') return '<div class="empty"><strong>Rien de sorti pour l’instant cette semaine.</strong>Les nouveautés tombent en général le vendredi à minuit.</div>';
  return '<div class="empty"><strong>Aucune sortie annoncée pour l’instant.</strong>Les annonces apparaissent ici dès qu’une plateforme ou la presse les publie.</div>';
}

function render() {
  INDEX = new Map();
  if (daysIO) { daysIO.disconnect(); daysIO = null; }
  $$('.tab, .bn').forEach(a => { if (a.dataset.view === S.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.body.dataset.view = S.view;
  $filters.classList.toggle('v-concerts', S.view === 'concerts');
  paintToggle();
  $('#q').placeholder = S.view === 'concerts' ? 'Artiste, salle ou ville' : 'Artiste ou titre';
  $('#gear').classList.toggle('on', S.view === 'parametres');

function viewWeek() {

  const ws = addDays(weekStartOf(t), S.week * 7), we = addDays(ws, 6);
  const base = DATA.items.filter(r => r.date >= ws && r.date <= we);

  // beaucoup de sorties chaque semaine : les plus attendues d’abord, le reste en un clic (tout s’affiche pendant une recherche)
  const CAP = { 'sec-albums': 24, 'sec-ep': 12, 'sec-singles': 40 };

    : `<p class="more-row sec-more"><button class="btn" type="button" data-open="${id}">${arr.length - CAP[id] === 1 ? `Afficher l’autre ${one}` : `Afficher les ${arr.length - CAP[id]} autres ${many}`}</button></p>`);
  if (albums.length) html += section('Albums', albums.length, `<div class="grid">${cap('sec-albums', albums).map(cardHtml).join('')}</div>${moreBtn('sec-albums', albums, 'album', 'albums')}`, 'sec-albums');

  if (singles.length) html += section('Singles', singles.length, `<div class="rows">${cap('sec-singles', singles).map(r => rowHtml(r, false)).join('')}</div>${moreBtn('sec-singles', singles, 'single', 'singles')}`, 'sec-singles');
  const more = elsewhereHtml(base);

  if (FB_CONFIG) {

// listes par jour (à venir, concerts) : les premiers jours tout de suite, la suite au fil du défilement
const groupByDate = list => {
  const groups = [];
  let g = null;
  for (const x of list) {
    if (!g || g.date !== x.date) groups.push(g = { date: x.date, items: [] });
    g.items.push(x);
  }
  return groups;
};
let daysIO = null;
const DAYS_KEEP = {};   // lignes déjà affichées par vue : une mise à jour ou un retour sur l’onglet garde la position
function paintDays(groups, rowFn, relFn) {
  if (daysIO) { daysIO.disconnect(); daysIO = null; }
  $content.innerHTML = '<div class="days-end" aria-hidden="true"></div>';
  const end = $('.days-end', $content);
  const view = S.view;
  let i = 0, month = '', box = null, shown = 0;
  const more = budget => {
    let n = 0;
    while (i < groups.length && n < budget) {
      const grp = groups[i++];
      const d = parseYmd(grp.date);
      const m = `${MON[d.getMonth()]} ${d.getFullYear()}`;
      if (m !== month) {
        month = m;
        end.insertAdjacentHTML('beforebegin', `<h2 class="month">${esc(cap(m))}</h2><div class="days"></div>`);
        box = end.previousElementSibling;
      }
      box.insertAdjacentHTML('beforeend', `<section class="day">
        <div class="day-h"><div class="day-d">${esc(cap(fmtShort(grp.date)))}</div><div class="day-r">${esc(relFn(grp.date))}</div></div>
        <div class="day-list">${grp.items.map(rowFn).join('')}</div>
      </section>`);
      n += grp.items.length;
    }
    shown += n;
    DAYS_KEEP[view] = Math.max(DAYS_KEEP[view] || 0, shown);
    if (i >= groups.length) { if (daysIO) { daysIO.disconnect(); daysIO = null; } end.remove(); }
  };
  more(Math.max(70, DAYS_KEEP[view] || 0));
  if (i < groups.length && 'IntersectionObserver' in window) {
    daysIO = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) more(90); }, { rootMargin: '1600px 0px' });
    daysIO.observe(end);
  } else if (i < groups.length) more(Infinity);
}

function viewConcerts() {

  for (const c of base) {

  $$('[data-cc]', $filters).forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.cc === S.cc)); b.querySelector('.n').textContent = kc[b.dataset.cc] || 0; });
  fadeSegs(true);
  const list = base.filter(c => (S.cat === 'all' || c.cat === S.cat) && (S.cc === 'all' || c.cc === S.cc))
    .sort((a, b) => a.date.localeCompare(b.date) || b.pop - a.pop);
  const fests = list.filter(c => c.fest).length;

  $head.innerHTML = `
    <div class="head-main"><p class="kicker">Concerts et festivals</p><h1 class="h1">Concerts</h1>
      <p class="sub">Les dates en France, en Belgique et en Suisse des artistes suivis. Touche une date pour voir les billets.</p></div>
    ${statsHtml([[list.length, plural(list.length, 'date', 'dates')], [soon, 'dans les 30 jours'], [fests, plural(fests, 'festival', 'festivals')], [cities, plural(cities, 'ville', 'villes')]])}`;
  if (!CONCERTS.loaded) { $content.innerHTML = '<div class="empty"><strong>Chargement des concerts…</strong></div>'; return; }
  if (!CONCERTS.items.length) {
    $content.innerHTML = '<div class="empty"><strong>Les concerts arrivent bientôt.</strong>Le robot relève les agendas des grandes villes deux fois par jour.</div>';
    return;
  }
  if (!list.length) { $content.innerHTML = '<div class="empty"><strong>Aucun concert avec ces filtres.</strong>Essaie un autre genre ou un autre pays.<br><button class="btn" type="button" data-reset>Tout afficher</button></div>'; return; }

const $drawer = $('#drawer'), $dbody = $('#d-body');
let lastFocus = null;
let previews = new Map();     // identifiant de titre Deezer -> extrait (récupéré à l’ouverture, les liens expirent)
let jpSeq = 0;
function jsonp(url, timeout = 10000) {
  return new Promise((resolve, reject) => {
    const name = `__affut${++jpSeq}`;
    const s = document.createElement('script');
    const done = () => { clearTimeout(timer); s.remove(); window[name] = () => {}; };
    const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, timeout);
    window[name] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = `${url}${url.includes('?') ? '&' : '?'}output=jsonp&callback=${name}`;
    document.head.appendChild(s);
  });
}
async function loadPreviews(r) {
  if (!r.dz) return;
  try {
    const alb = await jsonp(`https://api.deezer.com/album/${r.dz}`);
    for (const t of (alb.tracks && alb.tracks.data) || []) if (t.preview) previews.set(t.id, t.preview);
    if (S.detail === r.key) paintDetail(r);
  } catch (e) { /* les extraits sont un bonus */ }
}
// la fiche a sa propre adresse (#semaine?fiche=dz123) : le bouton retour la ferme, et on peut la partager
const FICHE_RE = /[?&]fiche=([A-Za-z0-9_-]{2,80})/;
const baseHash = () => location.hash.split('?')[0] || `#${S.view === 'user' ? SET.start : S.view}`;
let fichePushed = false, pendingFiche = '';
function ficheUrl(r) { return `${location.origin}${location.pathname}#${r.date > today() ? 'a-venir' : 'semaine'}?fiche=${encodeURIComponent(r.key)}`; }
function openDetail(key, opts = {}) {
  const r = INDEX.get(key) || DATA.byKey.get(key) || EXTRA.get(key);
  if (!r) return;
  if (!opts.fromRoute) {
    const h = `${baseHash()}?fiche=${encodeURIComponent(key)}`;
    if (FICHE_RE.test(location.hash)) history.replaceState(null, '', h);
    else { history.pushState(null, '', h); fichePushed = true; }
  }
  S.detail = key;
  lastFocus = document.activeElement;
  document.body.classList.add('d-open');
  $drawer.setAttribute('aria-hidden', 'false');
  $drawer.inert = false;
  $drawer.scrollTop = 0;
  paintDetail(r);
  $('#d-close').focus({ preventScroll: true });
  loadDetails().then(() => { if (S.detail === key) paintDetail(r); }, () => { if (S.detail === key) paintDetail(r, true); });
  loadPreviews(r);
}
function detailRelease() { return S.detail ? INDEX.get(S.detail) || DATA.byKey.get(S.detail) || EXTRA.get(S.detail) || null : null; }
function closeDetail(opts = {}) {
  if (!S.detail) return;
  S.detail = null;
  if (!opts.fromRoute && FICHE_RE.test(location.hash)) {
    if (fichePushed) { fichePushed = false; history.back(); }   // revient à l’adresse d’avant, sans recharger la vue
    else history.replaceState(null, '', baseHash());
  }
  document.body.classList.remove('d-open');
  $drawer.setAttribute('aria-hidden', 'true');
  $drawer.inert = true;
  audio.pause();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
function listenHtml(r) {

async function shareRelease(key) {
  const r = INDEX.get(key) || DATA.byKey.get(key) || EXTRA.get(key);
  if (!r) return;
  const url = ficheUrl(r);

  }

function paintDetail(r, failed) {
  const rows = DETAILS ? DETAILS[r.key] || [] : null;   // [n, titre, feats, avec, durée, explicite, id Deezer, extrait]
  const released = r.date <= today();
  const rel = relLabel(r.date);
  const complete = rows && rows.length && (!r.n || rows.length >= r.n);
  const total = rows && rows.length ? rows.reduce((s, x) => s + (x[4] || 0), 0) : 0;
  const dur = r.dur || (complete ? total : 0);
  const facts = [];
  if (dur && (complete || r.dur)) facts.push(['Durée', fmtTotal(dur)]);
  if (r.n || (rows && rows.length)) facts.push(['Titres', String(r.n || rows.length)]);
  if (r.label) facts.push(['Label', r.label]);
  if (r.genre) facts.push(['Genre', r.genre]);
  const featCount = new Map();
  for (const f of r.feats) featCount.set(norm(f), { name: f, n: 0 });
  if (rows) for (const x of rows) for (const f of [x[3], ...(x[2] || [])].filter(Boolean)) {
    const k = norm(f);
    const e = featCount.get(k) || { name: f, n: 0 };
    e.n++; featCount.set(k, e);
  }
  const feats = [...featCount.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name, 'fr'));
  const playing = audio.src && !audio.paused ? audio.src : '';
  let tracks;
  if (!rows) tracks = failed ? '<p class="d-msg">La tracklist n’a pas pu être chargée. Réessaie dans un instant.</p>' : `<div class="trk-sk">${'<div class="sk" style="height:44px"></div>'.repeat(6)}</div>`;
  else if (!rows.length) tracks = `<p class="d-msg">${released ? 'Tracklist indisponible pour ce projet.' : 'La tracklist n’est pas encore dévoilée.'}</p>`;
  else {
    const partial = r.n && rows.length < r.n ? ` · ${rows.length} ${plural(rows.length, 'titre dévoilé', 'titres dévoilés')} sur ${r.n}` : '';
    tracks = `<h3 class="d-h3">Tracklist${partial}<span class="trk-st" id="trk-st" aria-live="polite"></span></h3>
      ${FB_CONFIG ? '<p class="trk-hint" id="trk-hint" hidden>Tes notes des sons s’enregistrent toutes seules. Touche à nouveau la même note pour l’enlever.</p>' : ''}
      <ol class="tracks" id="d-tracks" data-k="${esc(r.key)}">${rows.map((x, i) => {
      const [n, title, fts, by, d, ex, id, pv] = x;

async function queryReviews(field, value) {

  return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => tsMs(b.up) - tsMs(a.up));

function aggregate(list) {
  const m = new Map();
  for (const x of list) {
    let a = m.get(x.k);
    if (!a) { a = { n: 0, sum: 0, dist: new Array(10).fill(0), texts: 0, raters: 0, tracks: [], tl: '' }; m.set(x.k, a); }
    const r = Number.isInteger(x.r) && x.r >= 1 && x.r <= 10 ? x.r : 0;
    if (r) { a.n++; a.sum += r; a.dist[r - 1]++; if (x.tx) a.texts++; }
    let any = false;
    trDecode(x.tr).forEach((v, i) => {
      if (!v) return;
      any = true;
      const e = a.tracks[i] || (a.tracks[i] = { n: 0, sum: 0, avg: 0 });
      e.n++; e.sum += v;
    });
    if (any) { a.raters++; if (!a.tl && typeof x.tl === 'string') a.tl = x.tl; }
  }
  for (const a of m.values()) {
    a.avg = a.n ? a.sum / a.n / 2 : 0;
    for (const e of a.tracks) if (e) e.avg = e.sum / e.n / 2;
  }
  return m;
}

/* ---------- curseurs d’étoiles : note d’ensemble (#rate-in) et notes des sons (.trate) ---------- */
const SLIDERS = '#rate-in, .trate';

/* ---------- écriture ---------- */
// une écriture à la fois par sortie : chacune part de l’état enregistré par la précédente

  }
  const data = {
    k, uid, r, w, d: rel.date, t: rel.title.slice(0, 300), a: rel.artist.slice(0, 300),
    img: (coverUrl(rel, 500) || '').slice(0, 600), rt: rel.rt, c: rel.cat, h: ME.profile.h, n: ME.profile.n, ph: phForReview(ME.profile.ph),
  };

  const update = () => F.updateDoc(ref, {
    ...data, up: F.serverTimestamp(),
    ...(tx ? {} : { tx: F.deleteField() }),
    ...(tr ? (tl ? {} : { tl: F.deleteField() }) : { tr: F.deleteField(), tl: F.deleteField() }),
  });
  try {
    try { await (cur ? update() : create()); }
    catch (e) {
      // la copie locale peut être en retard sur la base (autre appareil) : on tente l’autre écriture, une fois
      if (cur && e && e.code === 'not-found') await create();

    if (e && e.code === 'permission-denied' && tr && !tracksOff && windowOf(rel).state === 'open' && !trDecode(cur && cur.tr).some(Boolean)) {

      TRDRAFT.delete(k);
      return writeReview(k, patch);

    throw e;
  }
  const saved = { ...data, id, at: cur && cur.at ? cur.at : stamp(), up: stamp() };
  ME.reviews = ME.reviews || new Map();
  ME.reviews.set(k, saved);
  if (TRDRAFT.get(k) === draft) TRDRAFT.delete(k);
  afterWrite(k, w, saved, cur);
  return saved;
}
async function removeReview(k) {
  const { F, db, auth } = FB;

async function saveReview(k) {
  const r = detailRelease();
