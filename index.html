  const el = $('#rate-in');
  const v = el ? Number(el.dataset.v || 0) : 0;
  if (!v) { toast('Choisis d’abord une note, de ½ à 5 étoiles'); return; }
  const tx = ($('#rv-text') || {}).value || '';
  const btn = $('[data-act="rv-save"]');
  if (btn) btn.disabled = true;
  const had = !!(ME.reviews && ME.reviews.get(k) && ME.reviews.get(k).r);
  flushTrackSave(k);   // les notes des sons en attente partent avec la note
  try {
    await queueWrite(k, () => writeReview(k, { r: v, tx }));

    if (btn) btn.disabled = false;

  DRAFT.delete(k);
  toast(had ? 'Note mise à jour' : 'Note publiée');
  const now = detailRelease();

}
async function deleteReview(k) {
  const r = detailRelease();
  const d = DRAFT.get(k) || { r: 0, tx: '' };
  if (!d.del) { d.del = true; DRAFT.set(k, d); if (r && r.key === k) paintRatings(r); return; }
  const rel = relOf(k);

    flushTrackSave(k);
    // pendant la semaine, les notes des sons restent ; ensuite, la base n’accepte plus qu’une suppression complète
    if (rel && windowOf(rel).state === 'open') await queueWrite(k, () => writeReview(k, { r: 0, tx: '' }));

  } catch (e) { DRAFT.delete(k); toast('Suppression impossible pour le moment'); }
  const now = detailRelease();
  if (now && now.key === k) paintRatings(now);
  if (S.view === 'semaine') render();
}

/* ---------- classement et cartes de la semaine ---------- */
function rtChip(r) {
  const a = RATEABLE.has(r.rt) ? ratingOf(r) : null;

// les sons de la semaine : titres notés un par un, et singles d’un seul titre notés comme sortie
function topSongs(list) {

    if (r.rt === 'single' && (r.n || 1) <= 1) { if (a.n) out.push({ r, i: -1, title: r.title, n: a.n, sum: a.sum, avg: a.avg }); continue; }
    if (!a.raters) continue;
    const titles = trackTitles(r.key, a);
    a.tracks.forEach((e, i) => { if (e && e.n) out.push({ r, i, title: titles[i] || `Titre ${i + 1}`, n: e.n, sum: e.sum, avg: e.avg }); });

const PTRS = new Map();

  else {

// la zone gardée, rendue à `size` pixels : d’abord à 8 fois la taille au plus, puis réduite par moitiés (rendu net)
function renderCrop(size) {

/* ---------- abonnements ----------
   Comme sur Letterboxd : on s’abonne à quelqu’un sans demande à accepter (les notes sont publiques).
   Les abonnements sont dans users/{uid}.fr ; les abonnés se retrouvent par « fr contient son identifiant ». */
const USERS = new Map();      // uid -> profil public, ou null s’il est introuvable

const FOLLOWERS = new Map();  // uid -> { at, list, loading } : ses abonnés

async function usersByIds(ids) {
  const { F, db } = await fb();
  await Promise.all(chunks(ids, 30).map(async part => {
    const snap = await F.getDocs(F.query(F.collection(db, 'users'), F.where(F.documentId(), 'in', part)));
    const found = new Set();
    snap.docs.forEach(d => { USERS.set(d.id, d.data()); found.add(d.id); });
    part.forEach(i => { if (!found.has(i)) { USERS.set(i, null); GONE.add(i); } });

/* ---------- fil d’actualité (onglet Abonnements) ----------
   Les notes des abonnements, semaine par semaine : « uid parmi 30 » + « semaine = w »,
   ce qui ne demande aucun index composé dans Firestore. Tri du plus récent au plus ancien. */
let FEED = null;              // { at, weeks, items, done, stale }
const postTime = x => tsMs(x.at) || tsMs(x.up);
let FEED_TAB = 'tout';        // tout | critiques
const FEED_STEP = 4, FEED_MAX = 26;
const weekList = (from, n) => Array.from({ length: n }, (_, i) => addDays(weekStartOf(today()), -7 * (from + i)));
let feedLoading = null;
function loadFeed(more) {
  if (feedLoading) return feedLoading;
  const ids = following();
  const fresh = !FEED || FEED.stale;
  const from = more && !fresh ? FEED.weeks : 0;
  const weeks = weekList(from, FEED_STEP);
  feedLoading = (async () => {
    if (!ids.length) return (FEED = { at: Date.now(), weeks: FEED_STEP, items: [], done: true });
    const { F, db } = await fb();
    const got = [];
    await Promise.all(weeks.flatMap(w => chunks(ids, 30).map(async part => {
      const snap = await F.getDocs(F.query(F.collection(db, 'reviews'), F.where('uid', 'in', part), F.where('w', '==', w), F.limit(500)));
      snap.docs.forEach(d => got.push({ id: d.id, ...d.data() }));
    })));
    // en rafraîchissant les semaines récentes, on garde les plus anciennes déjà chargées
    const keep = fresh ? [] : FEED.items.filter(x => !weeks.includes(x.w));
    const items = [...keep, ...got].filter(x => ids.includes(x.uid)).sort((a, b) => postTime(b) - postTime(a));
    const n = more && !fresh ? from + FEED_STEP : fresh ? FEED_STEP : Math.max(FEED.weeks, FEED_STEP);
    return (FEED = { at: Date.now(), weeks: n, items, done: n >= FEED_MAX });
  })().finally(() => { feedLoading = null; });
  return feedLoading;
}

function suggestions() {

  const count = new Map();

  [...count.entries()].sort((a, b) => b[1].n - a[1].n).forEach(([uid, { n, x }]) => {

function pickCandidates(q) {
  const seen = new Set();
  const out = [];
  const push = x => { if (!x.k || seen.has(x.k)) return; seen.add(x.k); out.push(x); };
  for (const x of [...(ME.reviews || new Map()).values()].sort((a, b) => b.r - a.r)) push({ k: x.k, t: x.t, a: x.a, img: x.img, d: x.d, rt: x.rt, c: x.c, mine: x.r >= 1 ? x.r : 0 });
  const t = today();
  for (const r of [...DATA.items].filter(r => r.date <= t).sort((a, b) => b.pop - a.pop)) push({ k: r.key, t: r.title, a: r.artist, img: coverUrl(r, 500), d: r.date, rt: r.rt, c: r.cat });

}
const SCROLL = {};   // position de chaque onglet, retrouvée en y revenant
// fiche demandée par l’adresse : ouverte dès que les sorties sont chargées
function openFiche(key) {
  if (INDEX.has(key) || DATA.byKey.has(key) || EXTRA.has(key)) { pendingFiche = ''; openDetail(key, { fromRoute: true }); return; }
  if (DATA.generatedAt) { pendingFiche = ''; history.replaceState(null, '', baseHash()); toast('Cette sortie n’est plus dans la liste'); return; }
  pendingFiche = key;
}

/* =====================================================================
   Démarrage et actualisation automatique
   ===================================================================== */
$('#gear').innerHTML = I.gear;
applySettings();
$('#d-close').innerHTML = I.x;
$('#d-share').innerHTML = I.share;
$('#q').value = '';
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
window.addEventListener('hashchange', route);
window.addEventListener('pagehide', persistSeen);
let lastCheck = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') persistSeen();
  else if (Date.now() - lastCheck > 60e3) { lastCheck = Date.now(); loadData(false); }
});
route();
loadData(true);
loadConcerts(false);
paintAcct();
if (FB_CONFIG) setTimeout(() => fb().catch(() => {}), 200);
setInterval(() => { lastCheck = Date.now(); loadData(false); }, POLL_MS);
setInterval(paintStatus, 30e3);
setInterval(() => { if (!S.detail) render(); }, 15 * 60e3); // changement de jour, libellés relatifs
setInterval(() => { if (loadError) loadData(false); }, 30e3);
})();
</script>
