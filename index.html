<style>
:root {
  /* Direction : noir et blanc strict, comme le logo ; seules les pochettes apportent la couleur.
     Mise en page : grille de pochettes (albums, EP), liste dense (singles), frise par date (à venir). */
  --bg: #FFFFFF;
  --soft: #F2F2F0;
  --line: #E3E3E0;
  --ink: #0A0A0A;
  --ink-2: #3B3B3A;
  --muted: #6E6E6C;
  --font-display: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --wrap: 1240px;
  --shadow: 0 1px 2px rgba(10, 10, 10, .06), 0 12px 32px rgba(10, 10, 10, .10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0B; --soft: #181817; --line: #272726; --ink: #F4F4F1; --ink-2: #CFCFCB; --muted: #9D9D99;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0B0B; --soft: #181817; --line: #272726; --ink: #F4F4F1; --ink-2: #CFCFCB; --muted: #9D9D99;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font-body); font-stretch: 100%;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
a { color: inherit; }
img { max-width: 100%; display: block; }
svg { flex: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 600; text-decoration: none; }
.skip:focus { top: 12px; }

/* ---------- en-tête ---------- */
.top {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.top-in {
  position: relative; max-width: var(--wrap); margin: 0 auto;

/* ---------- structure ---------- */

let jpSeq = 0;
function jsonp(url, timeout = 15000) {
  return new Promise((resolve, reject) => {
    const name = `__affut${++jpSeq}`;
    const s = document.createElement('script');
    let done = false;
    const finish = () => {
      done = true; clearTimeout(timer); s.remove();
      window[name] = () => {};
      setTimeout(() => { try { delete window[name]; } catch (e) { window[name] = undefined; } }, 60000);
    };
    const timer = setTimeout(() => { if (!done) { finish(); reject(new Error('timeout')); } }, timeout);
    window[name] = data => { if (!done) { finish(); resolve(data); } };
    s.onerror = () => { if (!done) { finish(); reject(new Error('network')); } };
    s.async = true;
    s.src = `${url}${url.includes('?') ? '&' : '?'}output=jsonp&callback=${name}`;
    document.head.appendChild(s);
  });
}

// Deezer accepte 50 requêtes / 5 s : on reste sous la limite, avec priorité pour ce que l’on regarde.
const limiter = (() => {
  const WIN = 5200, MAX = 40, CONC = 6;
  const stamps = [], queue = [];
  let active = 0, timer = null;
  function pump() {
    timer = null;
    while (queue.length && active < CONC) {
      const now = Date.now();
      while (stamps.length && now - stamps[0] > WIN) stamps.shift();
      if (stamps.length >= MAX) { timer = setTimeout(pump, WIN - (now - stamps[0]) + 30); return; }
      const job = queue.shift();
      active++; stamps.push(now);
      Promise.resolve().then(job.fn).then(job.ok, job.ko).finally(() => { active--; if (!timer) pump(); });
    }
  }
  return (fn, prio) => new Promise((ok, ko) => {
    const job = { fn, ok, ko };
    if (prio) queue.unshift(job); else queue.push(job);
    if (!timer) pump();
  });
})();

/* =====================================================================
   Artistes suivis
   ===================================================================== */
let ART_V = 0, DATA_V = 0;
let artMemo = { v: -1, list: [], byId: new Map(), known: new Set() };
function artists() {
  if (artMemo.v === ART_V) return artMemo.list;
  const removed = new Set(follow.removed);
  const map = new Map();
  for (const a of DEFAULTS) if (!removed.has(a.id)) map.set(a.id, { ...a });
  for (const a of follow.added) if (!removed.has(a.id)) map.set(a.id, { ...a, src: 'add' });
  for (const c of chart.list || []) {
    const m = map.get(c.id);
    if (m) { m.pos = c.pos; continue; }
    if (removed.has(c.id) || IGNORE.has(c.id)) continue;
    map.set(c.id, { id: c.id, name: c.name, cat: 'auto', fans: Math.max(30000, (101 - c.pos) * 30000), it: 0, src: 'chart', pos: c.pos });
  }
  const list = [...map.values()];
  artMemo = { v: ART_V, list, byId: map, known: new Set(list.map(a => norm(a.name))) };
  return list;
}
function bumpArtists() { ART_V++; DATA_V++; }

const FR_RE = /[éèêëàâùûçôîïœ]|\b(le|la|les|des|du|une?|et|est|pas|mon|ma|mes|ton|ta|tes|je|tu|il|elle|nous|vous|on|ce|ça|qui|que|pour|avec|sans|dans|sur|moi|toi|plus|tout|rien|jamais|vie|nuit|coeur|amour|frère|soleil|mal|bien|fou|folle)\b/i;
const EN_RE = /\b(the|you|your|my|me|i|im|it|is|in|on|of|and|love|baby|night|dont|cant|we|they|money|life|feel|girl|time|world|up|down|out)\b/i;
function catOf(a, genreId, genreName, title) {
  if (a.cat === 'rfr' || a.cat === 'rus' || a.cat === 'mfr') return a.cat;
  const gid = genreId > 0 ? genreId : null;
  const known = gid != null || !!genreName;
  const rap = gid === 116 || /rap|hip/i.test(genreName || '');
  if (a.cat === 'fr') return !known || rap ? 'rfr' : 'mfr';
  const t = String(title || '').replace(/'/g, '');
  if (!known || rap) return (EN_RE.test(t) && !FR_RE.test(t)) ? 'rus' : 'rfr';
  return FR_RE.test(t) ? 'mfr' : null;
}

/* =====================================================================
   Construction de la liste des sorties
   ===================================================================== */
function compactArtist(list, now) {
  const t = today(), lo = addDays(t, -WINDOW_DAYS), hi = addDays(t, 400);
  let last = '';
  const items = [];
  for (const x of list) {
    const d = x.release_date || '';
    if (!isYmd(d)) continue;
    if (d <= t && d > last) last = d;
    if (d >= lo && d <= hi) items.push([x.id, x.title, d, x.record_type, x.genre_id, x.md5_image || '', x.fans || 0, x.explicit_lyrics ? 1 : 0]);
  }
  return { t: now, last, items };
}

function buildDeezer(t) {
  const lo = addDays(t, -WINDOW_DAYS);
  const map = new Map();
  for (const a of artists()) {
    const e = cache.a[a.id];
    if (!e || !e.items) continue;
    for (const [id, title, date, rt, genre, md5, fans, ex] of e.items) {
      if (date < lo) continue;
      let r = map.get(id);
      if (!r) {
        const cat = catOf(a, genre, '', title);
        if (!cat) continue;
        r = { key: 'dz' + id, src: 'dz', id, title, date, rt: TYPE_LABEL[rt] ? rt : 'album', genre, md5, fans: fans || 0, ex: !!ex, cat, arts: [] };
        map.set(id, r);
      }
      if (!r.arts.includes(a)) r.arts.push(a);
    }
  }
  // Une même sortie peut exister en version explicite et clean : on garde la meilleure.
  const best = new Map();
  for (const r of map.values()) {
    r.arts.sort((x, y) => y.fans - x.fans);
    r.artist = r.arts.map(x => x.name).join(' & ');
    const meta = cache.al[r.id];
    if (meta) { if (meta[0]) { r.artist = meta[0]; r.mainKnown = true; } r.n = meta[1] || 0; r.dur = meta[2] || 0; }
    r.pop = r.arts[0].fans + r.fans * 4;
    const k = `${r.arts.map(x => x.id).join(',')}|${norm(r.title)}|${r.date}`;
    const p = best.get(k);
    if (!p || (r.ex && !p.ex) || (r.ex === p.ex && r.fans > p.fans)) best.set(k, r);
  }
  return [...best.values()];
}

function extraItems(t) {
  const byId = artMemo.byId;
  const out = [];
  for (const x of (cache.it && cache.it.items) || []) {
    const a = byId.get(x.aid);
    if (!a || x.date <= t) continue;
    const cat = catOf(a, null, x.genre, x.title);
    if (!cat) continue;
    out.push({ key: 'it' + x.id, src: 'it', id: x.id, title: x.title, date: x.date, rt: x.rt, cover: x.cover, link: x.link, appleLink: x.link, n: x.n, ex: !!x.ex, cat, arts: [a], artist: x.artist || a.name, pop: a.fans });
  }
  for (const x of (cache.mb && cache.mb.items) || []) {
    const a = byId.get(x.aid);
    if (!a || x.date <= t) continue;
    const cat = catOf(a, null, '', x.title);
    if (!cat) continue;
    out.push({ key: 'mb' + x.id, src: 'mb', id: x.id, title: x.title, date: x.date, rt: x.rt, link: `https://musicbrainz.org/release-group/${x.id}`, cat, arts: [a], artist: x.artist || a.name, pop: a.fans * 0.9 });
  }
  for (const m of manual) {
    if (m.date < t) continue;
    out.push({ key: 'me' + m.id, src: 'me', id: m.id, title: m.title, date: m.date, rt: m.rt, cat: m.cat, arts: [], artist: m.artist, pop: 1 });
  }
  return out;
}

let dataMemo = { v: -1, day: '', items: [], byKey: new Map() };
function allItems() {
  const t = today();
  if (dataMemo.v === DATA_V && dataMemo.day === t) return dataMemo.items;
  artists();
  const dzItems = buildDeezer(t);
  const items = [...dzItems];
  const seen = new Map();
  const keyOf = r => `${norm((r.arts[0] && r.arts[0].name) || r.artist).slice(0, 40)}|${norm(baseTitle(r.title)).slice(0, 60)}`;
  for (const r of dzItems) { const k = keyOf(r); if (!seen.has(k)) seen.set(k, r); }
  for (const r of extraItems(t)) {
    const k = keyOf(r);
    const p = seen.get(k);
    if (p) {
      p.also = p.also || [];
      if (!p.also.includes(r.src) && p.src !== r.src) p.also.push(r.src);
      if (r.appleLink && !p.appleLink) p.appleLink = r.appleLink;
      continue;
    }
    seen.set(k, r);
    items.push(r);
  }
  dataMemo = { v: DATA_V, day: t, items, byKey: new Map(items.map(r => [r.key, r])) };
  return items;
}

/* =====================================================================
   Mise à jour : discographies Deezer, puis annonces Apple et MusicBrainz
   ===================================================================== */
function ttlFor(e) {
  const t = today();
  if (e.items && e.items.some(x => x[2] > t)) return 2 * HOUR;
  const age = e.last ? daysBetween(e.last, t) : 9999;
  const now = new Date();
  const fridayMorning = now.getDay() === 5 && now.getHours() < 14;
  if (age <= 120) return fridayMorning ? 20 * MIN : 2 * HOUR;
  if (age <= 400) return 6 * HOUR;
  return 24 * HOUR;
}

let saveTimer = null;
function save() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!store.set('cache1', cache)) {
    const ids = new Set(artists().map(a => a.id));
    for (const k of Object.keys(cache.a)) if (!ids.has(+k)) delete cache.a[k];
    store.set('cache1', cache);
  }
}
const saveSoon = () => { if (!saveTimer) saveTimer = setTimeout(save, 2000); };

async function loadChart(force) {
  if (!force && chart.t && Date.now() - chart.t < 12 * HOUR) return;
  try {
    const j = await dz('/chart/0/artists?limit=100');
    chart = { t: Date.now(), list: (j.data || []).map((a, i) => ({ id: a.id, name: a.name, pos: a.position || i + 1 })) };
    store.set('chart', chart);
    bumpArtists();
  } catch (e) { /* le classement est un bonus */ }
}

async function loadItunes(force) {
  if (!force && cache.it && Date.now() - cache.it.t < 12 * HOUR) return false;
  const t = today();
  // Identifiant Apple des artistes ajoutés à la main (une seule fois par artiste)
  let changed = false;
  for (const a of follow.added.filter(x => !x.it && !x.itTried).slice(0, 6)) {
    try {
      const j = await getJSON(`https://itunes.apple.com/search?entity=musicArtist&country=fr&limit=6&term=${encodeURIComponent(a.name)}`);
      const m = (j.results || []).find(x => norm(x.artistName) === norm(a.name));
      a.it = m ? m.artistId : 0;
    } catch (e) { /* on réessaiera */ }
    a.itTried = 1; changed = true;
    await sleep(3200);
  }
  if (changed) { store.set('follow', follow); bumpArtists(); }
  const list = artists().filter(a => a.it && (a.cat === 'rus' || a.fans >= 120000 || a.src === 'add'))
    .sort((x, y) => y.fans - x.fans).slice(0, 180);
  const byIt = new Map(list.map(a => [a.it, a]));
  const items = [];
  let ok = 0;
  for (let i = 0; i < list.length; i += 10) {
    const chunk = list.slice(i, i + 10);
    try {
      const j = await getJSON(`https://itunes.apple.com/lookup?entity=album&sort=recent&limit=25&country=fr&id=${chunk.map(a => a.it).join(',')}`, 20000);
      ok++;
      for (const x of j.results || []) {
        if (x.wrapperType !== 'collection' || !x.releaseDate) continue;
        const date = x.releaseDate.slice(0, 10);
        if (!isYmd(date) || date <= t || date > addDays(t, 400)) continue;
        const a = byIt.get(x.artistId);
        if (!a) continue;
        const name = x.collectionName || '';
        const rt = / - Single$/i.test(name) ? 'single' : / - EP$/i.test(name) ? 'ep' : (x.trackCount && x.trackCount <= 3 ? 'single' : 'album');
        items.push({
          id: x.collectionId, aid: a.id, title: name.replace(/ - (Single|EP)$/i, ''), artist: x.artistName, date, rt,
          n: x.trackCount || 0, ex: x.collectionExplicitness === 'explicit' ? 1 : 0, genre: x.primaryGenreName || '',
          cover: (x.artworkUrl100 || '').replace(/\/\d+x\d+bb\./, '/600x600bb.'), link: x.collectionViewUrl || '',
        });
      }
    } catch (e) { /* Apple limite à ~20 requêtes / minute : on continue */ }
    if (i + 10 < list.length) await sleep(3300);
  }
  if (ok) cache.it = { t: Date.now(), items: uniqBy(items, x => x.id) };
  return ok > 0;
}

async function loadMB(force) {
  if (!force && cache.mb && Date.now() - cache.mb.t < 12 * HOUR) return false;
  const t = today(), from = addDays(t, 1), to = addDays(t, 400);
  const list = artists().slice().sort((x, y) => y.fans - x.fans);
  const byName = new Map(list.map(a => [norm(a.name), a]));
  const items = [];
  let ok = 0;
  for (let i = 0; i < list.length; i += 25) {
    const chunk = list.slice(i, i + 25);
    const q = `firstreleasedate:[${from} TO ${to}] AND (${chunk.map(a => `artist:"${a.name.replace(/["\\]/g, '\\$&')}"`).join(' OR ')})`;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const j = await getJSON(`https://musicbrainz.org/ws/2/release-group?fmt=json&limit=100&query=${encodeURIComponent(q)}`, 20000);
        ok++;
        for (const g of j['release-groups'] || []) {
          const date = g['first-release-date'] || '';
          if (!isYmd(date) || date <= t) continue;
          const credit = g['artist-credit'] || [];
          const names = credit.map(c => c.name || (c.artist && c.artist.name) || '');
          const a = names.map(n => byName.get(norm(n))).find(Boolean);
          if (!a) continue;
          const type = String(g['primary-type'] || '').toLowerCase();
          items.push({
            id: g.id, aid: a.id, title: g.title, date, rt: type === 'single' ? 'single' : type === 'ep' ? 'ep' : 'album',
            artist: credit.map((c, k) => names[k] + (c.joinphrase || '')).join('').trim(),
          });
        }
        break;
      } catch (e) { await sleep(2500); }
    }
    await sleep(1250);
  }
  if (ok) cache.mb = { t: Date.now(), items: uniqBy(items, x => x.id) };
  return ok > 0;
}

// Deezer range aussi les featurings dans la discographie de l’invité : on récupère le vrai artiste
// principal, le nombre de titres et la durée des sorties récentes et à venir (une fois par sortie).
function albumMeta(alb) {
  const mains = (alb.contributors || []).filter(c => c.role === 'Main').map(c => c.name);
  if (!mains.length && alb.artist) mains.push(alb.artist.name);
  return [mains.join(' & '), alb.nb_tracks || 0, alb.duration || 0];
}
async function enrichAlbums() {
  const t = today();
  const from = addDays(weekStartOf(t), -14);
  const todo = allItems().filter(r => r.src === 'dz' && r.date >= from && !cache.al[r.id])
    .sort((a, b) => b.date.localeCompare(a.date) || b.pop - a.pop).slice(0, 160);
  if (!todo.length) return false;
  let n = 0;
  await Promise.all(todo.map(r => dz(`/album/${r.id}`).then(alb => {
    cache.al[r.id] = albumMeta(alb);
    DATA_V++;
    if (++n % 15 === 0) renderSoon();
  }).catch(() => {})));
  const live = new Set();
  for (const e of Object.values(cache.a)) for (const it of e.items || []) live.add(String(it[0]));
  for (const k of Object.keys(cache.al)) if (!live.has(k)) delete cache.al[k];
  return n > 0;
}

let busy = false;
async function refresh(force = false) {
  if (busy) return;
  busy = true;
  S.error = '';
  paintStatus();
  try {
    await loadChart(force);
    const now = Date.now();
    const todo = artists()
      .filter(a => force || !cache.a[a.id] || now - cache.a[a.id].t > ttlFor(cache.a[a.id]))
      .sort((a, b) => (a.pos || 999) - (b.pos || 999) || b.fans - a.fans);
    if (todo.length) {
      S.prog = { done: 0, total: todo.length, ok: 0 };
      paintStatus();
      let lastPaint = Date.now();
      await Promise.all(todo.map(a => dz(`/artist/${a.id}/albums?limit=1000`)
        .then(res => { cache.a[a.id] = compactArtist(res.data || [], Date.now()); S.prog.ok++; })
        .catch(err => { if (err && err.code === 800) cache.a[a.id] = { t: Date.now(), last: '', items: [] }; })
        .finally(() => {
          S.prog.done++;
          DATA_V++;
          paintProgress();
          if (Date.now() - lastPaint > 1600) { lastPaint = Date.now(); renderSoon(); saveSoon(); }
        })));
      if (!S.prog.ok && todo.length > 2) S.error = 'Impossible de joindre Deezer. Vérifie ta connexion, puis réessaie.';
      S.prog = null;
      if (S.prog === null && !S.error) cache.at = Date.now();
      save();
      renderSoon();
    } else if (!cache.at) { cache.at = Date.now(); }
    // En parallèle : infos des sorties récentes (Deezer) et annonces (Apple Music, MusicBrainz)
    const tasks = [enrichAlbums().then(changed => { if (changed) { save(); renderSoon(); } })];
    const needIt = force || !cache.it || Date.now() - cache.it.t >= 12 * HOUR;
    const needMb = force || !cache.mb || Date.now() - cache.mb.t >= 12 * HOUR;
    if (needIt || needMb) {
      S.upcomingBusy = true;
      paintStatus();
      tasks.push(Promise.allSettled([needIt ? loadItunes(force) : false, needMb ? loadMB(force) : false]).then(res => {
        S.upcomingBusy = false;
        if (res.some(x => x.status === 'fulfilled' && x.value)) { DATA_V++; save(); renderSoon(); }
      }));
    }
    await Promise.allSettled(tasks);
  } finally {
    busy = false;
    S.prog = null;
    S.upcomingBusy = false;
    paintStatus();
  }
}

function paintStatus() {
  const st = $('#status'), rf = $('#refresh');

  if (S.prog) txt = `Mise à jour · ${S.prog.done}/${S.prog.total}`;
  else if (S.upcomingBusy) txt = 'Recherche des annonces…';

  st.textContent = txt;

  if (S.prog) $('#status').textContent = `Mise à jour · ${S.prog.done}/${S.prog.total}`;
  const n = $('#first-n');

const matchQ = (r, q) => !q || norm(`${r.title} ${r.artist}`).includes(q);
const matchType = r => S.type === 'all' || r.rt === S.type || (S.type === 'album' && r.rt === 'compile');
const matchCat = r => S.cat === 'all' || r.cat === S.cat;
function applyFilters(list) {
  const q = norm(S.q);
  return list.filter(r => matchCat(r) && matchType(r) && matchQ(r, q));
}
function paintFilters(base) {
  const q = norm(S.q);
  const cc = { all: 0, rfr: 0, rus: 0, mfr: 0 }, tc = { all: 0, album: 0, ep: 0, single: 0 };
  for (const r of base) {
    if (!matchQ(r, q)) continue;
    if (matchType(r)) { cc.all++; cc[r.cat] = (cc[r.cat] || 0) + 1; }
    if (matchCat(r)) { tc.all++; const k = r.rt === 'compile' ? 'album' : r.rt; tc[k] = (tc[k] || 0) + 1; }
  }
  $$('[data-cat]', $filters).forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.cat === S.cat)); b.querySelector('.n').textContent = cc[b.dataset.cat] || 0; });
  $$('[data-type]', $filters).forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.type === S.type)); b.querySelector('.n').textContent = tc[b.dataset.type] || 0; });
}

const byPop = (a, b) => b.pop - a.pop || b.date.localeCompare(a.date);
const plural = (n, one, many) => `${n > 1 ? many : one}`;
function countTypes(list) {
  const c = { album: 0, ep: 0, single: 0 };
  for (const r of list) c[r.rt === 'compile' ? 'album' : r.rt]++;

}
function statsHtml(pairs) {

const section = (title, n, inner) => `<section class="sec"><div class="sec-h"><h2>${esc(title)}</h2><span class="n">${n}</span></div>${inner}</section>`;

function coverHtml(r, size) {

function flagFor(r) {
  const t = today();
  if (isNew(r)) return 'Nouveau';

function display(r) {

function srcText(r) {

function rowHtml(r, o = {}) {

  const v = display(r);

}

async function followArtist(id, name, fans, cat) {

  const def = DEFAULTS.find(a => a.id === id);
  follow.added = follow.added.filter(a => a.id !== id);
  if (!def || def.cat !== cat) follow.added.push({ id, name, cat, fans: fans || 0, it: def ? def.it : 0 });

  bumpArtists();

function unfollowArtist(id) {

/* =====================================================================
   Fiche détaillée
   ===================================================================== */
const $drawer = $('#drawer'), $dbody = $('#d-body');
const DETAILS = new Map();
let lastFocus = null;

const FEAT_PAREN = /\s*[(\[]\s*(?:feat\.?|ft\.?|featuring|avec|with)\s+([^)\]]+?)\s*[)\]]/i;
const FEAT_TAIL = /\s+(?:feat\.?|ft\.?|featuring)\s+(.+)$/i;
function splitNames(s) {
  const raw = String(s || '').trim();
  if (artMemo.known.has(norm(raw))) return [raw];
  return raw.split(/\s*,\s*|\s+&\s+|\s+et\s+|\s+and\s+|\s+x\s+/i).map(x => x.trim()).filter(Boolean);
}
function splitFeat(title) {
  const s = String(title || '');
  let m = s.match(FEAT_PAREN);
  if (m) return { clean: s.replace(FEAT_PAREN, '').trim(), feats: splitNames(m[1]) };
  m = s.match(FEAT_TAIL);
  if (m) return { clean: s.replace(FEAT_TAIL, '').trim(), feats: splitNames(m[1]) };
  return { clean: s, feats: [] };
}

async function detailDeezer(r) {
  const alb = await dz(`/album/${r.id}`, true);
  let tracks = (alb.tracks && alb.tracks.data) || [];
  if ((alb.nb_tracks || 0) > tracks.length) {
    try { const more = await dz(`/album/${r.id}/tracks?limit=300`, true); if (more.data && more.data.length) tracks = more.data; } catch (e) { /* on garde la première page */ }
  }
  const mains = (alb.contributors || []).filter(c => c.role === 'Main').map(c => c.name);
  if (!mains.length && alb.artist) mains.push(alb.artist.name);
  const mainSet = new Set(mains.map(norm));
  if (!cache.al[r.id]) { cache.al[r.id] = albumMeta(alb); DATA_V++; saveSoon(); }
  return {
    title: alb.title || r.title, artist: mains.join(' & ') || r.artist,
    cover: alb.cover_xl || alb.cover_big || '', date: isYmd(alb.release_date) ? alb.release_date : r.date,
    rt: TYPE_LABEL[alb.record_type] ? alb.record_type : r.rt, label: alb.label || '',
    genre: ((alb.genres && alb.genres.data) || []).map(g => g.name).join(', '),
    duration: alb.duration || 0, n: alb.nb_tracks || tracks.length, ex: !!alb.explicit_lyrics, fans: alb.fans || 0,
    link: alb.link || `https://www.deezer.com/album/${r.id}`, mains: mainSet,
    tracks: tracks.map((t, i) => {
      const sp = splitFeat(t.title || '');
      const by = t.artist && !mainSet.has(norm(t.artist.name)) ? t.artist.name : '';
      return { id: t.id, n: i + 1, title: sp.clean || t.title, feats: sp.feats.filter(f => !mainSet.has(norm(f)) && norm(f) !== norm(by)), by, dur: t.duration || 0, preview: t.preview || '', ex: !!t.explicit_lyrics, ok: t.readable !== false };
    }),
  };
}
// Les crédits exacts de chaque titre (artistes invités) viennent d’un appel par titre.
async function enrichFeats(r, d) {
  const list = d.tracks.filter(t => t.id).slice(0, 45);
  await Promise.all(list.map(t => dz(`/track/${t.id}`, true).then(x => {
    const contribs = x.contributors || [];
    const names = contribs.filter(c => c.role === 'Featured' || (c.role === 'Main' && !d.mains.has(norm(c.name)))).map(c => c.name)
      .filter(n => !d.mains.has(norm(n)) && norm(n) !== norm(t.by));
    if (names.length) t.feats = uniqBy(names, norm);
  }).catch(() => {})));
  d.featsDone = true;
  if (S.detail === r.key) paintDetail(r);
}
async function detailItunes(r) {
  const j = await getJSON(`https://itunes.apple.com/lookup?id=${r.id}&entity=song&country=fr&limit=200`);
  const res = j.results || [];
  const col = res.find(x => x.wrapperType === 'collection') || {};
  const tracks = res.filter(x => x.wrapperType === 'track').sort((a, b) => (a.discNumber - b.discNumber) || (a.trackNumber - b.trackNumber));
  const main = norm(col.artistName || r.artist);
  const total = tracks.reduce((s, t) => s + (t.trackTimeMillis || 0), 0) / 1000;
  return {
    title: String(col.collectionName || r.title).replace(/ - (Single|EP)$/i, ''), artist: col.artistName || r.artist,
    cover: String(col.artworkUrl100 || r.cover || '').replace(/\/\d+x\d+bb\./, '/1000x1000bb.'),
    date: isYmd(String(col.releaseDate || '').slice(0, 10)) ? col.releaseDate.slice(0, 10) : r.date, rt: r.rt,
    label: String(col.copyright || '').replace(/^[℗©]\s*\d{4}\s*/, ''), genre: col.primaryGenreName || '',
    duration: total, n: col.trackCount || tracks.length, ex: col.collectionExplicitness === 'explicit',
    link: col.collectionViewUrl || r.link, appleLink: col.collectionViewUrl || r.link, mains: new Set([main]), featsDone: true,
    tracks: tracks.map((t, i) => {
      const sp = splitFeat(t.trackName || '');
      const by = norm(t.artistName) !== main ? t.artistName : '';
      return { n: t.trackNumber || i + 1, title: sp.clean, feats: sp.feats, by, dur: (t.trackTimeMillis || 0) / 1000, preview: t.previewUrl || '', ex: t.trackExplicitness === 'explicit' };
    }),
  };
}
async function detailMB(r) {
  const j = await getJSON(`https://musicbrainz.org/ws/2/release?release-group=${r.id}&inc=recordings+artist-credits+labels&fmt=json&limit=10`);
  const size = rel => (rel.media || []).reduce((s, m) => s + (m['track-count'] || 0), 0);
  const rel = (j.releases || []).sort((a, b) => size(b) - size(a))[0];
  if (!rel) return { tracks: [], featsDone: true, mains: new Set() };
  const mainNames = new Set((rel['artist-credit'] || []).map(c => norm(c.name)));
  const tracks = (rel.media || []).flatMap(m => m.tracks || []).map((t, i) => {
    const credit = (t['artist-credit'] || []).map(c => c.name).filter(n => !mainNames.has(norm(n)));
    const sp = splitFeat(t.title || '');
    return { n: i + 1, title: sp.clean, feats: uniqBy([...credit, ...sp.feats], norm), by: '', dur: (t.length || 0) / 1000, preview: '' };
  });
  const li = (rel['label-info'] || []).find(x => x.label);
  return {
    title: rel.title || r.title, artist: (rel['artist-credit'] || []).map(c => c.name + (c.joinphrase || '')).join('') || r.artist,
    date: isYmd(rel.date) ? rel.date : r.date, rt: r.rt, label: li ? li.label.name : '', genre: '',
    duration: tracks.reduce((s, t) => s + t.dur, 0), n: tracks.length, tracks, link: r.link, mains: mainNames, featsDone: true,
  };
}
async function loadDetail(r) {
  if (DETAILS.has(r.key)) return;
  let d;
  if (r.src === 'dz') d = await detailDeezer(r);
  else if (r.src === 'it') d = await detailItunes(r);
  else if (r.src === 'mb') d = await detailMB(r);
  else d = { tracks: [], featsDone: true, mains: new Set() };
  DETAILS.set(r.key, d);
  if (r.src === 'dz') enrichFeats(r, d);
}

function findItem(key) {
  return INDEX.get(key) || (allItems(), dataMemo.byKey.get(key)) || savedItems().find(r => r.key === key) || null;
}
function openDetail(key) {
  const r = findItem(key);
  if (!r) return;
  S.detail = key;
  lastFocus = document.activeElement;
  document.body.classList.add('d-open');
  $drawer.setAttribute('aria-hidden', 'false');
  $drawer.inert = false;
  $drawer.scrollTop = 0;
  delete r._err;
  paintDetail(r);
  $('#d-close').focus({ preventScroll: true });
  loadDetail(r)
    .then(() => { if (S.detail === key) paintDetail(r); })
    .catch(() => { r._err = true; if (S.detail === key) paintDetail(r); });
}
function closeDetail() {
  if (!S.detail) return;
  S.detail = null;
  document.body.classList.remove('d-open');
  $drawer.setAttribute('aria-hidden', 'true');
  $drawer.inert = true;
  audio.pause();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}

function linksHtml(r, d) {
  const artist = (d && d.artist) || r.artist;
  const q = encodeURIComponent(`${artist} ${baseTitle((d && d.title) || r.title)}`);
  const L = [];
  L.push(['Deezer', r.src === 'dz' ? `https://www.deezer.com/fr/album/${r.id}` : `https://www.deezer.com/search/${q}`]);
  L.push(['Spotify', `https://open.spotify.com/search/${q}`]);
  L.push(['Apple Music', (d && d.appleLink) || r.appleLink || `https://music.apple.com/fr/search?term=${q}`]);
  L.push(['YouTube', `https://www.youtube.com/results?search_query=${q}`]);
  if (r.src === 'mb') L.push(['MusicBrainz', r.link]);
  const share = r.src === 'dz' ? `https://www.deezer.com/fr/album/${r.id}` : (d && d.appleLink) || r.appleLink || '';
  return L.map(([n, u]) => `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}${I.ext}</a>`).join('')
    + (share ? `<button class="btn" type="button" data-copy="${esc(share)}">${I.link}Copier le lien</button>` : '');
}
function tracksHtml(r, d) {
  if (!d) {
    if (r._err) return '<p class="d-msg">Impossible de charger le détail pour l’instant. Ferme la fiche et rouvre-la dans un moment.</p>';
    return `<div class="trk-sk">${'<div class="sk" style="height:44px"></div>'.repeat(6)}</div>`;
  }
  if (!d.tracks.length) {
    return `<p class="d-msg">${r.src === 'me' ? 'Date ajoutée à la main : la tracklist apparaîtra quand une plateforme publiera le projet.' : 'La tracklist n’est pas encore publiée.'}</p>`;
  }
  const playing = audio.src && !audio.paused ? audio.src : '';
  const partial = d.n && d.tracks.length < d.n ? ` · ${d.tracks.length} ${d.tracks.length > 1 ? 'titres dévoilés' : 'titre dévoilé'} sur ${d.n}` : '';
  return `<h3 class="d-h3">Tracklist${partial}${d.featsDone ? '' : ' · <span aria-live="polite">crédits en cours</span>'}</h3>
    <ol class="tracks">${d.tracks.map(tr => {
      const credits = [tr.by ? `avec ${esc(tr.by)}` : '', tr.feats.length ? `feat. ${esc(tr.feats.join(', '))}` : ''].filter(Boolean).join(' · ');
      const on = tr.preview && playing === tr.preview;
      return `<li class="trk${tr.ok === false ? ' off' : ''}">
        <span class="trk-n">${tr.n}</span>
        <span class="trk-m"><span class="trk-t">${esc(tr.title)}${tr.ex ? '<span class="ex" title="Explicite">E</span>' : ''}</span>${credits ? `<span class="trk-f">${credits}</span>` : ''}</span>
        <span class="trk-d">${tr.dur ? fmtDur(tr.dur) : ''}</span>
        ${tr.preview ? `<button class="play" type="button" data-play="${esc(tr.preview)}" aria-pressed="${on}" aria-label="Écouter un extrait de ${esc(tr.title)}">${on ? I.pause : I.play}</button>` : '<span></span>'}
      </li>`;
    }).join('')}</ol>`;
}
function paintDetail(r) {
  const d = DETAILS.get(r.key);
  const t = today();
  const date = d && isYmd(d.date) ? d.date : r.date;
  const released = date <= t;
  const rt = (d && d.rt) || r.rt;
  const title = (d && d.title) || r.title;
  const artist = (d && d.artist) || r.artist;
  const cover = (d && d.cover) || (r.md5 ? dzCover(r.md5, 1000) : r.cover || '');
  const inList = saved.some(s => s.key === r.key);
  const rel = relLabel(date);
  const facts = [];
  const complete = !!(d && d.tracks.length && (!d.n || d.tracks.length >= d.n));
  if (d && d.duration && complete) facts.push(['Durée', fmtTotal(d.duration)]);
  if (d && d.n) facts.push(['Titres', String(d.n)]);
  if (d && d.label) facts.push(['Label', d.label]);
  if (d && d.genre) facts.push(['Genre', d.genre]);
  if (d && d.fans) facts.push(['Fans Deezer', fmtNum(d.fans)]);
  const featCount = new Map();
  if (d) for (const tr of d.tracks) for (const f of [tr.by, ...tr.feats].filter(Boolean)) {
    const k = norm(f);
    const e = featCount.get(k) || { name: f, n: 0 };
    e.n++; featCount.set(k, e);
  }
  const feats = [...featCount.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name, 'fr'));
  $('#d-kicker').textContent = TYPE_LABEL[rt] || 'Fiche';
  $dbody.innerHTML = `
    <div class="d-cover cover">${cover ? `<img src="${esc(cover)}" alt="Pochette de ${esc(title)}">` : `<span class="ph" aria-hidden="true">${esc(initial(title))}</span>`}</div>
    <div class="d-main">
      <div class="meta"><span class="pill ${esc(rt)}">${esc(TYPE_LABEL[rt] || 'Album')}</span><span>${esc(CATS[r.cat] || '')}</span>${(d && d.ex) || r.ex ? '<span>Explicite</span>' : ''}${isNew(r) ? '<span>· Nouveau</span>' : ''}</div>
      <h2 class="d-title" id="d-title">${esc(title)}</h2>
      <p class="d-artist">${esc(artist)}</p>
      <p class="d-date">${released ? 'Sorti le' : 'Sortie prévue le'} ${esc(fmtLong(date))}${rel ? ` · ${esc(rel)}` : ''}</p>
      <div class="d-actions">
        <button class="btn${inList ? ' solid' : ''}" type="button" data-save="${esc(r.key)}" aria-pressed="${inList}">${inList ? `${I.check}Dans ma liste` : `${I.mark}Ajouter à ma liste`}</button>
        ${r.src === 'me' ? `<button class="btn" type="button" data-del-manual="${esc(r.id)}">${I.trash}Supprimer cette date</button>` : ''}
      </div>
      ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
      ${feats.length ? `<h3 class="d-h3">Featurings</h3><div class="chips">${feats.map(f => `<span class="chip">${esc(f.name)}${f.n > 1 ? `<span class="mono">×${f.n}</span>` : ''}</span>`).join('')}</div>` : ''}
      ${tracksHtml(r, d)}
      <h3 class="d-h3">Écouter</h3>
      <div class="links">${linksHtml(r, d)}</div>
      <p class="d-src">Source : ${esc(srcText(r))}</p>
    </div>`;
}

/* ---------- extraits audio ---------- */
const audio = new Audio();
audio.preload = 'none';
function syncPlay() {
  const playing = audio.src && !audio.paused ? audio.src : '';
  $$('[data-play]').forEach(b => {
    const on = !!playing && b.dataset.play === playing;
    b.setAttribute('aria-pressed', String(on));
    b.innerHTML = on ? I.pause : I.play;
  });
}
['play', 'pause', 'ended'].forEach(ev => audio.addEventListener(ev, syncPlay));
function togglePlay(url) {
  if (audio.src === url && !audio.paused) { audio.pause(); return; }
  audio.src = url;
  audio.play().catch(() => toast('Extrait indisponible pour ce titre'));
}

/* =====================================================================
   Actions
   ===================================================================== */
function savePrefs() { store.set('prefs', { cat: S.cat, type: S.type }); }
function toggleSave(key) {
  const r = findItem(key);
  if (!r) return;
  const i = saved.findIndex(s => s.key === key);
  if (i >= 0) { saved.splice(i, 1); toast('Retiré de ta liste'); }
  else {
    saved.unshift({ key: r.key, src: r.src, id: r.id, title: r.title, artist: r.artist, date: r.date, rt: r.rt, cat: r.cat, md5: r.md5 || '', cover: r.cover || '', link: r.link || '', appleLink: r.appleLink || '', ex: r.ex ? 1 : 0 });
    toast('Ajouté à ta liste');
  }
  store.set('saved', saved);
  $('#saved-n').textContent = saved.length ? saved.length : '';
  if (S.detail === key) paintDetail(r);
  if (S.view === 'ma-liste') render();
}
function applyTheme() {
  const root = document.documentElement;
  if (theme === 'auto') delete root.dataset.theme; else root.dataset.theme = theme;
  const dark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('meta[name="theme-color"]').setAttribute('content', dark ? '#0B0B0B' : '#FFFFFF');
  const label = `Thème : ${theme === 'auto' ? 'automatique' : theme === 'dark' ? 'sombre' : 'clair'}`;
  const b = $('#theme');
  b.setAttribute('aria-label', `${label}. Changer le thème`);
  b.title = label;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-key],[data-week],[data-cat],[data-type],[data-play],[data-save],[data-copy],[data-add],[data-cancel-add],[data-del-manual],[data-follow],[data-unfollow],[data-reset],[data-reset-follow],[data-retry],#refresh,#theme,#scrim,#d-close');
  if (!el) return;
  const ds = el.dataset;
  if (el.id === 'scrim' || el.id === 'd-close') { closeDetail(); return; }
  if (el.id === 'refresh') { refresh(true); return; }
  if (el.id === 'theme') {
    theme = theme === 'auto' ? 'light' : theme === 'light' ? 'dark' : 'auto';
    store.set('theme', theme); applyTheme();
    toast(theme === 'auto' ? 'Thème automatique (suit ton appareil)' : theme === 'dark' ? 'Thème sombre' : 'Thème clair');
    return;
  }
  if (ds.key) { openDetail(ds.key); return; }
  if (ds.week !== undefined) { S.week = Math.min(0, Math.max(-MAX_BACK, Number(ds.week))); render(); return; }
  if (ds.cat) { S.cat = ds.cat; savePrefs(); render(); return; }
  if (ds.type) { S.type = ds.type; savePrefs(); render(); return; }
  if (ds.reset !== undefined) { S.cat = 'all'; S.type = 'all'; S.q = ''; $('#q').value = ''; savePrefs(); render(); return; }
  if (ds.play) { togglePlay(ds.play); return; }
  if (ds.save) { toggleSave(ds.save); return; }
  if (ds.copy) {
    const url = ds.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
      .then(() => toast('Lien copié'), () => toast(url));
    return;
  }
  if (ds.add !== undefined) { S.adding = !S.adding; render(); return; }
  if (ds.cancelAdd !== undefined) { S.adding = false; render(); return; }
  if (ds.delManual) {
    manual = manual.filter(m => m.id !== ds.delManual);
    store.set('manual', manual);
    DATA_V++;
    closeDetail(); render(); toast('Date supprimée');
    return;
  }
  if (ds.follow) {
    const id = Number(ds.follow);
    const sel = $(`#cat-${id}`);
    followArtist(id, ds.name, Number(ds.fans), sel ? sel.value : 'rfr');
    const box = el.parentElement;
    if (box) box.outerHTML = '<span class="pill single">Suivi</span>';
    return;
  }
  if (ds.unfollow) { unfollowArtist(Number(ds.unfollow)); return; }
  if (ds.resetFollow !== undefined) {
    if (el.dataset.confirm !== '1') {
      el.dataset.confirm = '1';
      el.textContent = 'Confirmer : revenir à la liste d’origine';
      setTimeout(() => { if (document.contains(el)) { el.dataset.confirm = ''; el.textContent = 'Revenir à la liste d’origine'; } }, 4000);
      return;
    }
    follow = { added: [], removed: [] };
    store.set('follow', follow);
    bumpArtists(); paintArtists(); toast('Liste d’origine rétablie');
    return;
  }
  if (ds.retry !== undefined) { refresh(true); }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'add-form') {
    e.preventDefault();
    const f = new FormData(e.target);
    const date = String(f.get('date') || '');
    const artist = String(f.get('artist') || '').trim(), title = String(f.get('title') || '').trim();
    if (!artist || !title || !isYmd(date)) return;
    if (date <= today()) { toast('Choisis une date à venir'); return; }
    manual.push({ id: Date.now().toString(36), artist, title, date, rt: String(f.get('rt') || 'album'), cat: String(f.get('cat') || 'rfr') });
    store.set('manual', manual);
    S.adding = false;
    DATA_V++;
    render();
    toast('Date ajoutée à « À venir »');
  } else if (e.target.id === 'a-form') {
    e.preventDefault();
    searchArtists($('#a-q').value);
  }
});

let qTimer = null, aTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { S.q = e.target.value; render(); }, 140);
  } else if (e.target.id === 'a-q') {
    clearTimeout(aTimer);
    aTimer = setTimeout(() => searchArtists(e.target.value), 350);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.detail) { closeDetail(); return; }
  if (S.detail || S.view !== 'semaine' || e.altKey || e.ctrlKey || e.metaKey) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft' && S.week > -MAX_BACK) { S.week--; render(); }
  if (e.key === 'ArrowRight' && S.week < 0) { S.week++; render(); }
});

// Une pochette introuvable laisse place à une initiale
document.addEventListener('error', e => {
  const img = e.target;
  if (img && img.tagName === 'IMG' && img.parentElement && img.parentElement.classList.contains('cover')) {
    const ph = document.createElement('span');
    ph.className = 'ph'; ph.setAttribute('aria-hidden', 'true'); ph.textContent = '♪';
    img.replaceWith(ph);
  }
}, true);

function route() {
  const h = location.hash.replace('#', '');
  const v = ['a-venir', 'ma-liste', 'artistes'].includes(h) ? h : 'semaine';
  const changed = v !== S.view;
  S.view = v;
  if (S.detail) closeDetail();
  render();
  if (changed) window.scrollTo({ top: 0 });
}

/* =====================================================================
   Démarrage
   ===================================================================== */
$('#refresh').innerHTML = I.refresh;
$('#theme').innerHTML = I.theme;
$('#d-close').innerHTML = I.x;
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
window.addEventListener('hashchange', route);
window.addEventListener('pagehide', persistSeen);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') persistSeen();
  else refresh(false);
});
route();
refresh(false);
setInterval(() => refresh(false), 15 * MIN);
setInterval(() => { if (!busy) renderSoon(); }, 10 * MIN);
})();
</script>
</body>
</html>
